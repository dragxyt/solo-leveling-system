/* ---------- weekly clock: report first, then the scaling announcement ---------- */
let sysTimer = null;
function queueSys(delay){ if(sysTimer) return; sysTimer = setTimeout(() => { sysTimer = null; pumpSys(); }, delay == null ? 1800 : delay); }
function pumpSys(){                                        // never replaces another dialog
  if(!state) return;
  const rep = state.reports.find(r => !r.seen);
  if(!rep && !state.scaleNote) return;
  if($('#modal') || $('#arise') || WK.on || revealOpen){ queueSys(2500); return; }
  if(rep) showReport(rep.id); else showScale();
}
function weeklyCheck(){
  if(!state) return;
  const today = dkey(), mon = weekKey(today); let changed = false;
  if(state.reportWeek !== mon){
    const prev = addDays(mon, -7);
    if(state.weekStats[prev]) makeReport(prev);            // no stats for that week (new or upgraded save): nothing to report
    state.reportWeek = mon; changed = true;
  }
  if(state.scaleWeek !== mon){ runScaling(mon); changed = true; }
  wkStat();                                                // this week always has a counter
  const cut = addDays(today, -CONFIG.scaling.keepLog);
  Object.keys(state.qlog).forEach(k => { if(k < cut) delete state.qlog[k]; });
  const wks = Object.keys(state.weekStats).sort();
  if(wks.length > CONFIG.report.keepStats) wks.slice(0, wks.length - CONFIG.report.keepStats).forEach(k => delete state.weekStats[k]);
  if(changed){ save(); render(); queueSys(); }
}

function questForm(q){
  const isNew = !q;
  q = q || { name:'', stat:'str', diff:'E', target:10, unit:'reps', minutes:15, repeat:'daily' };
  const sel = (opts,val) => opts.map(([v,l]) => '<option value="'+v+'" '+(String(v)===String(val)?'selected':'')+'>'+l+'</option>').join('');
  const d = modal('<h3>'+(isNew?'NEW QUEST':'EDIT QUEST')+'</h3><form id="qf" autocomplete="off">'
    +'<label>Quest name<input name="name" maxlength="40" value="'+esc(q.name)+'" placeholder="e.g. Read 20 pages" required></label>'
    +'<div class="two"><label>Linked stat<select name="stat">'+sel(STATS.map(k=>[k,STAT_NAME[k]]),q.stat)+'</select></label>'
    +'<label>Difficulty<select name="diff">'+sel(Object.keys(CONFIG.diffBase).map(k=>[k,k+'-Rank ('+CONFIG.diffBase[k]+')']),q.diff)+'</select></label></div>'
    +'<div class="two"><label>Target<input name="target" type="number" min="1" max="100000" step="any" inputmode="decimal" value="'+esc(q.target)+'" required></label>'
    +'<label>Unit<select name="unit">'+sel([['reps','reps'],['minutes','minutes'],['km','km']],q.unit)+'</select></label></div>'
    +'<div class="two"><label>Est. time (min)<input name="minutes" type="number" min="1" max="600" inputmode="numeric" value="'+esc(q.minutes)+'" required></label>'
    +'<label>Repeat<select name="repeat">'+sel([['daily','Daily'],['weekly','Weekly'],['once','One-time']],q.repeat)+'</select></label></div>'
    +'<p class="hint" id="qpv" style="margin-bottom:12px"></p>'
    +'<div class="row"><button class="btn" type="submit">SAVE</button><button class="btn red" type="button" data-r="x">CANCEL</button></div></form>');
  const f = $('#qf', d);
  const preview = () => {
    const m = clamp(parseInt(f.elements.minutes.value)||1, 1, 600);
    const xp = Math.round(questBaseXp({diff:f.elements.diff.value, minutes:m})*xpMult()*(state.fatigue>CONFIG.fatigueLimit?1-CONFIG.fatigueXpCut:1));
    $('#qpv', d).innerHTML = 'Reward now: <em class="green-t">+'+xp+' XP</em> &middot; fatigue +'+fatGain(m*CONFIG.fatiguePerMin).toFixed(1);
  };
  f.addEventListener('input', preview); preview();
  d.addEventListener('click', e => { if(e.target.closest('[data-r]')) closeModal(); });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const name = f.elements.name.value.trim().replace(/\s+/g,' ');
    const target = parseFloat(f.elements.target.value), minutes = parseInt(f.elements.minutes.value);
    if(!name || !(target>0) || !(minutes>=1 && minutes<=600)) return notify('INVALID','Check name, target and time.','pen');
    const data = { name, stat:f.elements.stat.value, diff:f.elements.diff.value, target, unit:f.elements.unit.value, minutes, repeat:f.elements.repeat.value };
    if(isNew) state.quests.push(Object.assign({ id:uid(), kind:'quest', lastDone:null, failedOn:null, done:false, created:dkey(), locked:false }, data));
    else {
      const real = state.quests.find(x => x.id===q.id);
      if(real.repeat !== data.repeat){ real.lastDone = null; real.done = false; }
      Object.assign(real, data);
      if(real.repeat==='once') real.failedOn = null;
    }
    closeModal(); save(); render();
    notify('QUEST SAVED', name, 'ok');
  });
}

/* =========================================================
   ACTIONS
   ========================================================= */
async function act(a, d){
  switch(a){
    case 'inc': if(state.points - pendSum() > 0){ pending[d.stat]++; sfx('inc', pendSum()); render(); } break;
    case 'dec': if(pending[d.stat] > 0){ pending[d.stat]--; render(); } break;
    case 'undo': pending = {str:0,agi:0,vit:0,int:0,sense:0}; render(); break;
    case 'confirm': {
      const n = pendSum(); if(!n) break;
      STATS.forEach(k => { if(pending[k]){ gainStat(k, pending[k]); state.alloc[k] += pending[k]; } });
      state.points -= n; pending = {str:0,agi:0,vit:0,int:0,sense:0};
      notify('STATS INCREASED', n+' point(s) allocated.', 'ok', 'statup'); afterChange(); break;
    }
    case 'q-new': questForm(); break;
    case 'q-edit': questForm(state.quests.find(q => q.id===d.id)); break;
    case 'q-done': {
      const q = state.quests.find(x => x.id===d.id);
      if(!q || questStatus(q) !== 'open') break;
      if(q.kind === 'rest' || !CONFIG.records.askOnComplete){ completeQuest(d.id); break; }
      const r = await askResult(q); if(r) completeQuest(d.id, r);
      break;
    }
    case 'q-work': openWorkout(d.id); break;
    case 'q-lock': {
      const q = state.quests.find(x => x.id===d.id); if(!q) break;
      q.locked = !q.locked; save(); render();
      notify(q.locked ? 'TARGET LOCKED' : 'TARGET UNLOCKED', q.name+(q.locked ? ' will not scale any more.' : ' scales every week again.'), 'info', 'lock');
      break;
    }
    case 'rep-open': if(!$('#modal') && !WK.on) showReport(d.id); break;
    case 'q-fail': {
      const q = state.quests.find(x => x.id===d.id);
      if(await ask('FAIL QUEST?', failWarnText(q), 'FAIL IT', true)) failQuest(d.id);
      break;
    }
    case 'q-del': {
      const q = state.quests.find(x => x.id===d.id);
      if(await ask('DELETE QUEST?', 'Remove <b>'+esc(q.name)+'</b> permanently?', 'DELETE', true)){ state.quests = state.quests.filter(x => x.id!==d.id); save(); render(); }
      break;
    }
    case 'pen-clear': clearPenalty(d.id); break;
    case 'hid-done': completeHidden(); break;
    case 'it-equip': if(equipItem(d.id)) afterChange(); break;
    case 'it-unequip': if(unequipItem(d.id)) afterChange(); break;
    case 'it-sell': if(await sellItem(d.id)) afterChange(); break;
    case 'it-dismantle': if(await dismantleItem(d.id)) afterChange(); break;
    case 'it-reveal': { const it = state.lootPending.find(x => x.id===d.id); if(it && !revealOpen && !$('#modal')) showLoot(it, false); break; }
    case 'forge': forgeItem(d.r); break;
    case 'equip': state.title = d.title; save(); render(); notify('TITLE EQUIPPED', d.title, 'ok'); break;
    case 'buy': buy(d.item); break;
    case 'gate-clear': if(await ask('GATE CLEARED?', 'Confirm you completed the challenge honestly.', 'YES')) clearGate(); break;
    case 'gate-fail': if(await ask('ABANDON GATE?', 'Abandoning costs about <b class="red-t">&minus;'+fmt(gateFailXp(state.gate.rank))+' XP</b>, heavy fatigue, and can drop your level.', 'ABANDON', true)){ failGate(false); afterChange(); } break;
    case 'arise': attemptArise(); break;
    case 'goto': sfx('tab'); tab = d.tab; pending = {str:0,agi:0,vit:0,int:0,sense:0}; render(); break;
    case 'shadow': shadowDetail(d.id); break;
    case 'cast': castSkill(d.id); break;
    case 'rebirth': askRebirth(); break;
    case 'nt-toggle': state.notif.on = !state.notif.on; save(); render(); notify('SYSTEM', state.notif.on ? 'System messages enabled.' : 'System messages silenced. Weakness noted.', 'info'); break;
    case 'nt-test': Remind.test(); break;
    case 'nt-ask': Remind.request(); break;
    case 'pwa-install': Remind.install(); break;       // a real tap, so the browser allows the prompt directly
    case 'sound': setSfx(!AUDIO.prefs.sfx); render(); break;
    case 'music': setMusic(!AUDIO.prefs.music); render(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob);
      a2.download = 'system-'+state.name.replace(/[^\w-]+/g,'_')+'-'+dkey()+'.json';
      document.body.appendChild(a2); a2.click(); a2.remove(); setTimeout(()=>URL.revokeObjectURL(a2.href), 1000);
      notify('EXPORT','Save file downloaded.','ok'); break;
    }
    case 'import': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = () => {
        const file = inp.files[0]; if(!file) return;
        const r = new FileReader();
        r.onload = async () => {
          try{
            const s = normalize(JSON.parse(r.result));
            if(await ask('IMPORT SAVE?', 'This replaces your current progress with <b>'+esc(s.name)+'</b> (Level '+s.level+').', 'IMPORT')){
              state = s; pending = {str:0,agi:0,vit:0,int:0,sense:0}; rollover(); save(); render(); notify('IMPORT','Save loaded.','ok');
            }
          }catch(e){ notify('IMPORT FAILED','That file is not a valid System save.','pen'); }
        };
        r.readAsText(file);
      };
      inp.click(); break;
    }
    case 'logout':
      if(!cloudEnabled) break;
      if(await ask('LOG OUT?', 'Your progress is saved to your account. You can log back in from any device.', 'LOG OUT')){
        await cloudSaveNow();
        if(cloudStatus !== 'synced' && !(await ask('NOT SYNCED YET', 'The latest progress could not be confirmed in the cloud. It is kept on this device, but logging out now may leave it behind. Log out anyway?', 'LOG OUT', true))) break;
        if(cloudStatus === 'synced'){ try{ localStorage.removeItem(localKey()); }catch(e){} }
        try{ await fbAuth.signOut(); }catch(e){ notify('ERROR','Could not log out. Try again.','pen'); }
      }
      break;
    case 'reset':
      if(await ask('RESET EVERYTHING?', 'All progress will be erased. Export a backup first if you might want it back.', 'ERASE', true)){
        try{ localStorage.removeItem(localKey()); }catch(e){}
        if(cloudEnabled && fbUser){ clearTimeout(cloudTimer); try{ await docRef().delete(); cloudStatus = 'synced'; }catch(e){ cloudStatus = 'error'; } }
        state = null; pending = {str:0,agi:0,vit:0,int:0,sense:0}; tab = 'status'; render();
      }
      break;
  }
}

   Each player's save is one document: saves/<uid>. Firestore rules must restrict it to its owner.

const AUTH_ERR = {
  'auth/invalid-email':'That email address is not valid.',
  'auth/user-not-found':'No account with that email. Create one instead.',
  'auth/wrong-password':'Wrong password.',
  'auth/invalid-credential':'Wrong email or password.',
  'auth/email-already-in-use':'An account with this email already exists. Log in instead.',
  'auth/weak-password':'Password must be at least 6 characters.',
  'auth/too-many-requests':'Too many attempts. Wait a moment and try again.',
  'auth/network-request-failed':'No connection. Check your internet and try again.',
  'auth/popup-closed-by-user':'',
  'auth/cancelled-popup-request':'',
  'auth/unauthorized-domain':'This website address is not authorized. Add it in Firebase: Authentication, Settings, Authorized domains.',
  'auth/operation-not-allowed':'This sign-in method is not enabled in Firebase (Authentication, Sign-in method).'
};
let authMode = 'login';
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + src)); document.head.appendChild(s); });
}
async function initFirebase(){
  const base = 'https://www.gstatic.com/firebasejs/' + CONFIG.firebaseSdk + '/';
  await loadScript(base + 'firebase-app-compat.js');
  await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
  firebase.initializeApp(CONFIG.firebase);
  fbAuth = firebase.auth(); fbDb = firebase.firestore();
  try{ await fbDb.enablePersistence({ synchronizeTabs:true }); }catch(e){ /* unsupported browser: online-only is fine */ }
}
const docRef = () => fbDb.collection(CONFIG.cloudCollection).doc(fbUser.uid);
async function cloudFetch(){
  const snap = await docRef().get();
  if(!snap.exists) return null;
  try{ return normalize(JSON.parse(snap.data().data)); }catch(e){ return null; }
}
function syncText(){
  if(cloudStatus === 'saving') return navigator.onLine === false ? 'Offline, will sync later' : 'Saving...';
  return ({ idle:'Ready', synced:'Synced ✔', offline:'Offline, saved on this device', error:'Sync error' })[cloudStatus] || '';
}
function updateSyncBadge(){ const el = $('#sync'); if(el) el.textContent = syncText(); }
function scheduleCloudSave(){ cloudStatus = 'saving'; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudSaveNow, 900); updateSyncBadge(); }
async function cloudSaveNow(){
  clearTimeout(cloudTimer);
  if(!cloudEnabled || !fbUser || !state || !cloudLoaded) return;
  try{
    await docRef().set({ data: JSON.stringify(state), clientUpdated: state.savedAt || Date.now(), email: fbUser.email || '' });
    cloudStatus = 'synced';
  }catch(e){
    cloudStatus = 'error';
    if(!cloudErrShown){ cloudErrShown = true; notify('SYNC ERROR', e && e.code === 'permission-denied' ? 'Cloud save was refused. Check your Firestore rules.' : 'Could not reach the cloud. Progress is kept on this device.', 'pen'); }
  }
  updateSyncBadge();
}
async function syncFromCloud(){
  if(!cloudEnabled || !fbUser || $('#modal')) return;
  try{
    const cloud = await cloudFetch();
    const newer = cloud && state && (cloud.savedAt || 0) > (state.savedAt || 0);
    if(newer){
      state = cloud; pending = {str:0,agi:0,vit:0,int:0,sense:0}; rollover();
      try{ localStorage.setItem(localKey(), JSON.stringify(state)); }catch(e){}
      cloudLoaded = true; cloudStatus = 'synced'; render();
      notify('SYNC', 'Loaded your newest progress from the cloud.', 'info');
    } else if(!cloudLoaded){
      cloudLoaded = true; save(); render();
    }
  }catch(e){ /* still offline */ }
}

  const login = authMode === 'login';
  $('#main').innerHTML = '<div class="win formwin fade"><h2>[ SYSTEM LOGIN ]</h2>'
    +'<div class="row" style="margin-bottom:14px"><button class="btn '+(login?'green':'')+'" data-auth="login">LOG IN</button><button class="btn '+(!login?'green':'')+'" data-auth="signup">CREATE ACCOUNT</button></div>'
    +'<form id="af"><label>Email<input name="email" type="email" autocomplete="email" required></label>'
    +'<label>Password<input name="password" type="password" minlength="6" autocomplete="'+(login?'current-password':'new-password')+'" required></label>'
    +(login?'':'<label>Confirm password<input name="password2" type="password" minlength="6" autocomplete="new-password" required></label>')
    +'<p class="hint red-t" id="aerr" style="min-height:1.3em;margin-bottom:8px"></p>'
    +'<button class="btn wide" type="submit">'+(login?'ENTER':'CREATE ACCOUNT')+'</button></form>'
    +'<div class="sub" style="text-align:center">OR</div><button class="btn wide" id="gbtn">SIGN IN WITH GOOGLE</button>'
    +(login?'<p style="margin-top:14px;text-align:center"><a href="#" id="forgot" style="color:var(--blue2)">Forgot password?</a></p>':'')
    +'<p class="hint" style="margin-top:12px;text-align:center">Your progress is saved to your account and follows you to any device.</p></div>';
  const err = t => { const e = $('#aerr'); if(e) e.textContent = t; };
  $$('[data-auth]').forEach(b => b.onclick = () => { authMode = b.dataset.auth; showAuth(); });
  const f = $('#af');
  f.addEventListener('submit', async e => {
    e.preventDefault(); err('');
    const email = f.elements.email.value.trim(), pw = f.elements.password.value;
    if(!login && pw !== f.elements.password2.value) return err('Passwords do not match.');
    const btn = $('button[type=submit]', f); btn.disabled = true;
    try{ if(login) await fbAuth.signInWithEmailAndPassword(email, pw); else await fbAuth.createUserWithEmailAndPassword(email, pw); }
    catch(ex){ err(ex.code in AUTH_ERR ? AUTH_ERR[ex.code] : 'Error: ' + (ex.message || ex.code)); btn.disabled = false; }
  });
  $('#gbtn').onclick = async () => {
    err(''); const prov = new firebase.auth.GoogleAuthProvider();
    try{ await fbAuth.signInWithPopup(prov); }
    catch(ex){
      if(ex.code === 'auth/popup-blocked' || ex.code === 'auth/operation-not-supported-in-this-environment'){ fbAuth.signInWithRedirect(prov); return; }
      err(ex.code in AUTH_ERR ? AUTH_ERR[ex.code] : 'Error: ' + (ex.message || ex.code));
    }
  };
  const fg = $('#forgot');
  if(fg) fg.onclick = async ev => {
    ev.preventDefault();
    const email = f.elements.email.value.trim();
    if(!email) return err('Type your email above first.');
    try{ await fbAuth.sendPasswordResetEmail(email); notify('PASSWORD RESET', 'If that account exists, a reset email is on its way.', 'ok'); err(''); }
    catch(ex){ err(ex.code in AUTH_ERR ? AUTH_ERR[ex.code] : 'Error: ' + (ex.message || ex.code)); }
  };
}
async function enterAccount(user){
  fbUser = user; cloudLoaded = false; cloudStatus = 'idle'; cloudErrShown = false;
  showLoading('SYNCING WITH THE SYSTEM...');
  let cloud = null, fetched = true;
  try{ cloud = await cloudFetch(); }catch(e){ fetched = false; }
  const local = loadLocal();
  if(!fetched && !local) return showCloudError('Could not reach your account data. Check your connection and try again.', true);
  let chosen = null;
  if(cloud && local) chosen = (local.savedAt || 0) > (cloud.savedAt || 0) ? local : cloud;
  else chosen = cloud || local;
  if(!chosen && fetched){
    const legacy = loadLocal(CONFIG.saveKey);          // progress saved on this device before accounts existed
    if(legacy && await ask('FOUND LOCAL PROGRESS', 'Progress saved on this device was found: <b>'+esc(legacy.name)+'</b> (Level '+legacy.level+'). Upload it to your account?', 'UPLOAD')) chosen = legacy;
  }
  state = chosen; pending = {str:0,agi:0,vit:0,int:0,sense:0};
  cloudLoaded = fetched; cloudStatus = fetched ? 'synced' : 'offline';
  if(state){ rollover(); checkTitles(); checkSkills(); trialSync(); }
  save();
  render();
  if(state){ queueReveal(1200); queueSys(2600); }
}
function startCloud(){
  showLoading('CONNECTING TO THE SYSTEM...');
  initFirebase().then(() => {
    fbAuth.onAuthStateChanged(user => {
      if(user){ if(!fbUser || fbUser.uid !== user.uid) enterAccount(user); }
      else { fbUser = null; state = null; cloudLoaded = false; closeModal(); showAuth(); }
    });
  }).catch(() => showCloudError('Could not load the login service. Check your internet connection and try again.', false));
}

/* =========================================================
   SYSTEM MESSAGES: reminders, notifications and the System's voice
   Delivery order: service worker notification > Notification API > in-app System toast.
   The pure logic between the NOTIF-CORE markers has no DOM access, so it can be tested alone.
   ========================================================= */
/*NOTIF-CORE*/
function hmMin(s){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(s)); return m ? Math.min(23, +m[1])*60 + Math.min(59, +m[2]) : null; }
function sanitizeNotif(x){
  const D = CONFIG.notif.defaults, o = (x && typeof x === 'object') ? x : {};
  const sent = (o.sent && typeof o.sent === 'object') ? o.sent : {};
  return {
    on: o.on === undefined ? D.on : !!o.on,
    morning: hmMin(o.morning) === null ? D.morning : String(o.morning),
    evening: clamp(Math.floor(+o.evening || D.evening), 1, 6),
    lastAsk: Math.max(0, +o.lastAsk || 0),
    lastInstall: Math.max(0, +o.lastInstall || 0),
    sent: { date: typeof sent.date === 'string' ? sent.date : null, n: Math.max(0, Math.floor(+sent.n || 0)), keys: (Array.isArray(sent.keys) ? sent.keys : []).map(String).slice(-40), at: Math.max(0, +sent.at || 0) },
    recent: (Array.isArray(o.recent) ? o.recent : []).map(String).slice(-CONFIG.notif.repeatMemory)
  };
}
function defaultNotif(){ return sanitizeNotif({}); }
const fillLine = (t, v) => String(t).replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : '');
function pickLine(pool, n, vars){                       // random, never one of the last N lines used
  const L = CONFIG.notif.lines[pool] || []; if(!L.length) return '';
  let ok = L.map((_, i) => i).filter(i => !n.recent.includes(pool+':'+i));
  if(!ok.length) ok = L.map((_, i) => i);
  const i = ok[Math.floor(Math.random()*ok.length)];
  n.recent.push(pool+':'+i); while(n.recent.length > CONFIG.notif.repeatMemory) n.recent.shift();
  return fillLine(L[i], vars);
}
function remindPlan(s, now){                            // everything that is due right now, most urgent first
  const C = CONFIG.notif, n = s.notif; if(!n || !n.on) return [];
  const day = dkey(now), m = now.getHours()*60 + now.getMinutes();
  const sent = n.sent.date === day ? n.sent : { keys:[] };
  const open = s.quests.filter(q => q.repeat === 'daily' && q.kind !== 'rest' && q.created <= day && questStatus(q) === 'open');
  const xp = open.length ? penaltyXp(open.reduce((a, q) => a + questBaseXp(q), 0), nextFailStreak(), day) : 0;
  const days = s.lastActive ? diffDays(s.lastActive, day) : 0;
  const vars = { name:s.name, lv:s.level, streak:s.streak, fail:s.failStreak, open:open.length, xp:fmt(xp), days };
  const T = k => hmMin(C.times[k]), mor = hmMin(n.morning), out = [];
  const add = (kind, key, cond) => { if(cond && !sent.keys.includes(key)) out.push({ kind, key, vars }); };
  const h = s.hidden;
  add('hid',  'hid:'+(h && h.deadline), !!h);
  add('hidw', 'hidw:'+(h && h.deadline), !!h && h.deadline > now.getTime() && h.deadline - now.getTime() <= C.hiddenWarnMin*60000);
  add('pen',  'pen:'+day, s.penalties.some(p => p.date === day) && m >= T('penalty'));
  add('gate', 'gate:'+day, !!s.gate && weekKey(addDays(day, 1)) !== weekKey(day) && m >= T('gate'));    // last day of the gate's week
  add('evening', 'evening', open.length > 0 && m >= 1440 - n.evening*60);
  add('risk', 'risk', s.streak >= C.riskStreakMin && s.lastActive !== day && m >= T('risk'));           // the streak breaks if nothing is done today
  add('fail', 'fail', s.failStreak >= C.failStreakMin && open.length > 0 && m >= T('fail'));
  add('back', 'back', !!s.lastActive && days >= C.comebackDays);
  add('morning', 'morning', open.length > 0 && mor !== null && m >= mor && m < mor + C.lateWindowMin);
  add('mot',  'mot', open.length > 0 && m >= T('motivation') && m < T('motivation') + C.lateWindowMin);
  return out;
}
function remindNext(s, now){                            // the single reminder to send now, or null (daily cap and spacing applied)
  const C = CONFIG.notif, n = s.notif; if(!n) return null;
  const sent = n.sent.date === dkey(now) ? n.sent : { n:0, at:0 };
  if(sent.n >= C.maxPerDay) return null;
  const list = remindPlan(s, now), gapOk = now.getTime() - sent.at >= C.minGapMin*60000;
  return list.find(it => (gapOk || C.kinds[it.kind].urgent) && !(C.kinds[it.kind].filler && sent.n >= C.maxPerDay - C.reserveForWarnings)) || null;
}
/*END-NOTIF-CORE*/
const Remind = {
  armed:false, swReg:null, last:0, png:'icon-192.png',
  supported(){ return typeof Notification !== 'undefined'; },
  perm(){ return this.supported() ? Notification.permission : 'unsupported'; },
  installEvt:null,
  init(){ this.registerSW(); this.listenInstall(); },
  standalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; },
  listenInstall(){                                      // Chrome/Edge/Android: keep the install prompt so the in-app button can open it
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); Remind.installEvt = e; if(state && tab === 'log') render(); });
    addEventListener('appinstalled', () => { Remind.installEvt = null; notify('SYSTEM', 'The System is installed on this device.', 'ok'); if(state && tab === 'log') render(); });
  },
  install(){                                            // must be called straight from a tap
    const e = this.installEvt; if(!e) return; this.installEvt = null;
    try{ e.prompt(); e.userChoice.then(r => { if(r.outcome !== 'accepted') notify('SYSTEM', 'Installation declined. The browser menu can still do it.', 'info'); if(state && tab === 'log') render(); }); }catch(x){}
  },
  maybeInstall(){                                       // one in-theme install offer, at most weekly, never while another modal is open
    const n = state.notif;
    if(!this.installEvt || this.standalone() || $('#modal') || revealOpen || WK.on) return false;
    if(Date.now() - n.lastInstall < CONFIG.notif.askAgainDays*864e5) return false;
    n.lastInstall = Date.now(); save();
    const d = modal('<h3>[ SYSTEM ]</h3><p>Install the System on this device for full-screen play, an app icon and faster access.</p><div class="row"><button class="btn" data-r="1">INSTALL</button><button class="btn" data-r="0">LATER</button></div>');
    d.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if(!b) return; closeModal(); if(b.dataset.r === '1') Remind.install(); });
    return true;
  },
  arm(){ this.armed = true; },                          // called by the boot-screen tap: nothing asks for permission before it
  registerSW(){                                         // browsers refuse service workers built from a Blob, so this needs the real sw.js file over HTTPS
    if(!('serviceWorker' in navigator) || !window.isSecureContext || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register(CONFIG.notif.swPath).then(r => { Remind.swReg = r; }).catch(() => {});
  },
  request(){                                            // must be called straight from a tap
    return new Promise(res => {
      let p; try{ p = Notification.requestPermission(res); }catch(e){ return res('default'); }
      if(p && p.then) p.then(res, () => res('default'));
    }).then(r => {
      if(r === 'granted') notify('SYSTEM', 'Consent acknowledged. The System will contact you.', 'ok');
      else if(r === 'denied') notify('SYSTEM', 'Refusal recorded. The System will not ask again.', 'info');
      if(state && tab === 'log') render();
      return r;
    });
  },
  maybeAsk(){                                           // the in-theme permission modal: only while permission is still "default"
    const C = CONFIG.notif, n = state.notif;
    if(!this.supported() || Notification.permission !== 'default' || !n.on) return false;
    if(Date.now() - n.lastAsk < C.askAgainDays*864e5) return false;
    if($('#modal') || revealOpen || WK.on) return false;
    n.lastAsk = Date.now(); save();
    const d = modal('<h3>[ SYSTEM ]</h3><p>The System requests permission to send you messages. Refusing is not recommended.</p><div class="row"><button class="btn" data-r="1">ACCEPT</button><button class="btn" data-r="0">LATER</button></div>');
    sfx('warn');
    d.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if(!b) return; closeModal(); if(b.dataset.r === '1') Remind.request(); });
    return true;
  },
  show(title, body, kind, warn){                        // real notification; false means "use the toast instead"
    try{
      const o = { body, tag:'system-'+kind, icon:this.png || undefined, badge:this.png || undefined, renotify:true, data:{ kind }, vibrate:warn ? [120,60,160] : [60,40,60] };
      if(this.swReg && this.swReg.showNotification){
        o.actions = [{ action:'open', title:'OPEN' }, { action:'dismiss', title:'DISMISS' }];
        this.swReg.showNotification('[ '+title+' ]', o); return true;
      }
      const n = new Notification('[ '+title+' ]', o);
      n.onclick = () => { try{ window.focus(); n.close(); }catch(e){} };
      return true;
    }catch(e){ return false; }
  },
  deliver(kind, body, opt){
    const info = CONFIG.notif.kinds[kind] || CONFIG.notif.kinds.mot, snd = info.warn ? 'remindWarn' : 'remind';
    const sys = this.perm() === 'granted' && (document.hidden || (opt && opt.force));
    if(sys && this.show(info.title, body, kind, info.warn)){ sfx(snd); return; }
    notify(info.title, body, info.warn ? 'pen' : 'info', snd);     // blocked, unsupported or app in front: same line as a System toast
  },
  fire(it){
    const n = state.notif, day = dkey();
    if(n.sent.date !== day) n.sent = { date:day, n:0, keys:[], at:0 };
    n.sent.n++; n.sent.keys.push(it.key); n.sent.at = Date.now();
    const body = pickLine(CONFIG.notif.kinds[it.kind].pool, n, it.vars);
    save(); this.deliver(it.kind, body, null);
  },
  tick(){
    try{
      if(!state || !state.notif || !this.armed) return;
      const t = Date.now(); if(t - this.last < CONFIG.notif.checkSec*1000) return; this.last = t;
      if(this.maybeAsk() || this.maybeInstall()) return;
      const it = remindNext(state, new Date()); if(it) this.fire(it);
    }catch(e){}
  },
  celebrate(){                                          // level-up line; not counted against the daily cap
    try{
      const n = state.notif; if(!n || !n.on) return;
      const body = pickLine('levelup', n, { name:state.name, lv:state.level, streak:state.streak, fail:state.failStreak, open:0, xp:'0', days:0 });
      setTimeout(() => Remind.deliver('levelup', body, null), 1500);
    }catch(e){}
  },
  test(){
    const n = state.notif, body = pickLine('motivation', n, { name:state.name, lv:state.level, streak:state.streak, fail:state.failStreak, open:0, xp:'0', days:0 });
    save(); this.deliver('mot', body, { force:true });
  },
  logCard(){
    const n = state.notif, p = this.perm();
    const st = { unsupported:'NOT SUPPORTED', granted:'ALLOWED', denied:'BLOCKED', default:'NOT ASKED' }[p];
    const lab = 'style="flex:1 1 100%;margin:4px 0 0"';
    return '<div class="win"><h2>[ SYSTEM MESSAGES ]</h2>'
      +'<div class="kv"><span>Permission</span><b>'+st+'</b></div>'
      +'<div class="kv"><span>Delivery</span><b>'+(p === 'granted' ? (this.swReg ? 'Notifications (service worker)' : 'Notifications') : 'In-app toasts')+'</b></div>'
      +'<div style="height:10px"></div><div class="row">'
      +'<button class="btn" data-act="nt-toggle">MESSAGES: '+(n.on ? 'ON' : 'OFF')+'</button><button class="btn" data-act="nt-test">SEND TEST</button>'
      +(p === 'default' ? '<button class="btn" data-act="nt-ask">ALLOW ALERTS</button>' : '')
      +(this.installEvt && !this.standalone() ? '<button class="btn" data-act="pwa-install">INSTALL APP</button>' : '')
      +'<label '+lab+'>Morning reminder<input type="time" data-nt="morning" value="'+esc(n.morning)+'"></label>'
      +'<label '+lab+'>Evening warning, hours before midnight<select data-nt="evening">'+[1,2,3,4,5,6].map(h => '<option value="'+h+'"'+(h === n.evening ? ' selected' : '')+'>'+h+'</option>').join('')+'</select></label></div>'
      +(p === 'denied' ? '<p class="hint red-t" style="margin-top:10px">Notifications are blocked for this site, so the System will not ask again. Messages still appear inside the app. To allow them: open your browser\'s site settings (the lock icon next to the address, or Settings &gt; Site settings &gt; Notifications), set this site to Allow, then reload.</p>' : '')
      +(p === 'unsupported' ? '<p class="hint" style="margin-top:10px">This browser cannot show notifications. The System will speak through in-app messages instead.</p>' : '')
      +(!this.standalone() && !this.installEvt ? '<p class="hint" style="margin-top:10px">Install: Chrome and Edge show an install icon in the address bar on the hosted HTTPS site. On iPhone use Share &gt; Add to Home Screen.</p>' : '')
      +'<p class="hint" style="margin-top:10px">Reminders arrive while the app is open or in a background tab. Up to '+CONFIG.notif.maxPerDay+' per day.</p></div>';
  }
};
$('#main').addEventListener('change', e => {            // reminder times in the LOG tab
  const k = e.target.dataset && e.target.dataset.nt; if(!k || !state) return;
  if(k === 'morning' && hmMin(e.target.value) !== null) state.notif.morning = e.target.value;
  if(k === 'evening') state.notif.evening = clamp(Math.floor(+e.target.value || 2), 1, 6);
  save(); notify('SYSTEM', 'Schedule updated.', 'ok');
});
Remind.init();

setInterval(tickClock, 1000);
setInterval(() => { if(cloudEnabled && fbUser && !cloudLoaded) syncFromCloud(); }, 30000);
document.addEventListener('visibilitychange', () => {
  audioVisibility(document.hidden);
  if(!document.hidden){ tickClock(); syncFromCloud(); wkWake(); } else cloudSaveNow();
});
addEventListener('pagehide', () => { cloudSaveNow(); });

function boot(){
  if(cloudEnabled){
    startCloud();
  } else {
    state = loadLocal();
    if(state){ rollover(); checkTitles(); checkSkills(); trialSync(); save(); }
    render();
    if(state){ queueReveal(1200); queueSys(2600); }                    // show loot that was waiting when the app was closed
  }
}
/* the boot screen exists so the first tap can unlock audio */
const bootEl = $('#boot');
bootEl.addEventListener('click', async () => {
  await audioUnlock();
  if(AUDIO.prefs.music) startMusic();
  sfx('boot');
  bootEl.classList.add('gone'); setTimeout(() => bootEl.remove(), 650);
  $('#mus').hidden = false; syncMusBtn();
  boot(); Remind.arm();
}, { once:true });
$('#mus').addEventListener('click', () => setMusic(!AUDIO.prefs.music));
$('#main').addEventListener('input', e => {
  const v = e.target.dataset && e.target.dataset.vol; if(!v) return;
  AUDIO.prefs[v === 'sfx' ? 'sfxVol' : 'musVol'] = e.target.value / 100;
  if(v === 'sfx') applySfxGain(); else applyMusicGain();
});
$('#main').addEventListener('change', e => {
  const v = e.target.dataset && e.target.dataset.vol; if(!v) return;
  saveAudioPrefs(); if(v === 'sfx') sfx('quest');
});
</script>
