<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="System">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>The System - Player Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03060f;--panel:rgba(8,20,44,.74);--blue:#00b4ff;--blue2:#4fd1ff;--dim:#7d9bc0;--text:#d9ecff;
  --red:#ff3b57;--gold:#ffd24a;--green:#3dffa5;--purple:#a06bff;--orange:#ff9a3d;
  --glow:0 0 8px rgba(0,180,255,.55),0 0 24px rgba(0,180,255,.25);
  --nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100%;background:radial-gradient(ellipse at 50% -10%,#0b2a52 0%,#050c1c 45%,#02050c 100%) fixed;color:var(--text);
  font-family:'Rajdhani',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:17px;line-height:1.35;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:900;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,180,255,.035) 3px,rgba(0,0,0,0) 4px)}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
h1,h2,h3,.orb{font-family:'Orbitron',system-ui,sans-serif;letter-spacing:.08em}
small{color:var(--dim);font-size:.82em}
button,input,select{font-family:inherit}
#app{position:relative;z-index:1;min-height:100vh}
#main{padding:14px 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}
.fade{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* NAV */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(3,9,22,.95);border-top:1px solid var(--blue);box-shadow:0 -4px 20px rgba(0,180,255,.2);z-index:50;backdrop-filter:blur(8px)}
#nav[hidden]{display:none}
#nav .brand{display:none}
#nav button{flex:1;min-width:0;background:none;border:0;color:var(--dim);font:600 9px 'Orbitron',sans-serif;letter-spacing:.03em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:44px;cursor:pointer;transition:.15s}
#nav button .ic{font-size:19px;line-height:1}
#nav button.on{color:var(--blue2);text-shadow:var(--glow);background:linear-gradient(0deg,rgba(0,180,255,.16),transparent)}
@media(min-width:900px){
  body.hasnav #app{margin-left:210px}
  #nav{top:0;bottom:auto;right:auto;width:210px;height:100%;flex-direction:column;border-top:0;border-right:1px solid var(--blue);padding:0;box-shadow:4px 0 20px rgba(0,180,255,.2)}
  #nav .brand{display:block;font:900 16px 'Orbitron';color:var(--blue2);text-shadow:var(--glow);padding:26px 22px 22px;letter-spacing:.2em}
  #nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;padding:0 22px;height:52px;font-size:12px;letter-spacing:.1em;background:none}
  #nav button.on{background:linear-gradient(90deg,rgba(0,180,255,.2),transparent);border-left:3px solid var(--blue)}
  #main{padding:26px 28px 40px}
}

/* WINDOWS */
.win{position:relative;background:var(--panel);border:1px solid var(--blue);box-shadow:var(--glow),inset 0 0 30px rgba(0,120,255,.08);
  padding:14px;margin-bottom:16px;border-radius:2px;backdrop-filter:blur(3px)}
.win::before,.win::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--blue2)}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win>h2{font-size:13px;color:var(--blue2);text-shadow:var(--glow);margin:-2px 0 12px;padding-bottom:9px;border-bottom:1px solid rgba(0,180,255,.3);
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.win.red{border-color:var(--red);box-shadow:0 0 10px rgba(255,59,87,.45),inset 0 0 30px rgba(255,0,40,.07)}
.win.red::before,.win.red::after{border-color:var(--red)}
.win.red>h2{color:var(--red);border-color:rgba(255,59,87,.35);text-shadow:0 0 8px rgba(255,59,87,.6)}
.win.gold{border-color:var(--gold)}
.win.gold>h2{color:var(--gold);text-shadow:0 0 8px rgba(255,210,74,.5)}
.sub{font:700 11px 'Orbitron';letter-spacing:.14em;color:var(--dim);margin:14px 0 8px}
.hint{color:var(--dim);font-size:.9em}
.gold-t{color:var(--gold)}
.green-t{color:var(--green)}
.red-t{color:var(--red)}

/* BUTTONS */
.btn{font:700 12px 'Orbitron',sans-serif;letter-spacing:.07em;color:var(--blue2);background:rgba(0,120,220,.12);border:1px solid var(--blue);
  padding:10px 14px;min-height:44px;cursor:pointer;border-radius:2px;transition:.15s;text-transform:uppercase}
.btn:hover{background:rgba(0,180,255,.25);box-shadow:var(--glow)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}
.btn.red{color:var(--red);border-color:var(--red);background:rgba(255,59,87,.1)}
.btn.red:hover{background:rgba(255,59,87,.25);box-shadow:0 0 14px rgba(255,59,87,.5)}
.btn.gold{color:var(--gold);border-color:var(--gold);background:rgba(255,210,74,.08)}
.btn.green{color:var(--green);border-color:var(--green);background:rgba(61,255,165,.08)}
.btn.sq{min-width:44px;padding:0;font-size:18px}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 120px}

/* BARS */
.bar{height:18px;background:rgba(0,30,60,.85);border:1px solid rgba(0,180,255,.5);position:relative;overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0077c8,#00d0ff);transition:width .9s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px #00b4ff}
.bar.hp>i{background:linear-gradient(90deg,#b3162d,#ff4d6a);box-shadow:0 0 12px #ff3b57}
.bar.mp>i{background:linear-gradient(90deg,#3b4bd6,#7f8bff);box-shadow:0 0 12px #6a78ff}
.bar.fat>i{background:linear-gradient(90deg,#8a5a00,#ffb13d);box-shadow:0 0 12px #ff9a3d}
.bar.fat.hot>i{background:linear-gradient(90deg,#a33000,#ff5a1f)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 10px 'Orbitron';text-shadow:0 0 4px #000,0 0 4px #000;letter-spacing:.06em}
.barlab{display:flex;justify-content:space-between;font:700 10px 'Orbitron';letter-spacing:.12em;color:var(--dim);margin-top:2px}
.mini{height:4px;background:rgba(0,60,110,.6);margin-top:5px;position:relative}
.mini>i{position:absolute;left:0;top:0;bottom:0;background:var(--blue2);box-shadow:0 0 6px var(--blue)}

/* STATUS */
.idgrid{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.lvl{flex:0 0 92px;height:92px;border:2px solid var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--glow),inset 0 0 20px rgba(0,180,255,.2);
  background:rgba(0,40,90,.4)}
.lvl small{font:700 9px 'Orbitron';letter-spacing:.2em}
.lvl b{font:900 34px 'Orbitron';color:#fff;text-shadow:var(--glow);line-height:1.1}
.info{flex:1;min-width:0}
.info>div{display:flex;gap:8px;align-items:baseline;padding:2px 0;overflow-wrap:anywhere}
.info small{flex:0 0 52px;font:700 9px 'Orbitron';letter-spacing:.14em}
.rank{font:900 11px 'Orbitron';padding:3px 9px;border:1px solid currentColor;letter-spacing:.1em}
.r-E{color:#9db0c4}.r-D{color:#4be08c}.r-C{color:#3db8ff}.r-B{color:#a06bff}.r-A{color:#ff9a3d}.r-S{color:#ff3b57}.r-N{color:#ffd24a}
.pts{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;margin-bottom:10px;border:1px dashed rgba(0,180,255,.5);background:rgba(0,60,120,.2)}
.pts b{font:900 22px 'Orbitron';color:var(--gold);text-shadow:0 0 10px rgba(255,210,74,.5)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,180,255,.14)}
.srow:last-of-type{border-bottom:0}
.sname{flex:1;min-width:0}
.sname b{font:700 14px 'Orbitron';letter-spacing:.12em;display:block}
.sname small{display:block}
.sval{font:900 24px 'Orbitron';min-width:68px;text-align:right;color:#fff}
.sval.pend{color:var(--green)}
.sval em{font:700 11px 'Orbitron';font-style:normal;color:var(--green);margin-left:4px}
.sbtn{display:flex;gap:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(0,180,255,.12)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--dim)}
.kv b{text-align:right}

/* CARDS */
.card{background:rgba(0,28,60,.55);border:1px solid rgba(0,180,255,.4);padding:11px 12px;margin-bottom:10px;position:relative}
.card.done{border-color:rgba(61,255,165,.55);background:rgba(0,50,40,.35)}
.card.failed{border-color:rgba(255,59,87,.6);background:rgba(60,0,15,.35)}
.card.locked{opacity:.5;filter:grayscale(.6)}
.card.eq{border-color:var(--gold);box-shadow:0 0 12px rgba(255,210,74,.35)}
.card.pen{border-color:var(--red);background:rgba(60,0,15,.4)}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.qhead b{font-size:1.08em;overflow-wrap:anywhere}
.badge{font:900 12px 'Orbitron';min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid currentColor;flex:0 0 auto}
.meta{color:var(--dim);font-size:.93em;margin-bottom:8px}
.meta em{color:var(--blue2);font-style:normal}
.stamp{font:700 11px 'Orbitron';letter-spacing:.14em;margin:2px 0 6px}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.cd{font:700 20px 'Orbitron';color:var(--blue2);text-shadow:var(--glow)}
.bigtext{font:900 24px 'Orbitron';letter-spacing:.1em}

/* FORMS */
label{display:block;font:700 10px 'Orbitron';letter-spacing:.12em;color:var(--dim);margin-bottom:10px;text-transform:uppercase}
input,select{display:block;width:100%;margin-top:5px;min-height:44px;padding:9px 10px;font-size:16px;color:var(--text);background:rgba(0,20,45,.9);
  border:1px solid var(--blue);border-radius:2px;outline:none;font-family:'Rajdhani',sans-serif;font-weight:600;text-transform:none;letter-spacing:0}
input:focus,select:focus{box-shadow:var(--glow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* CHART */
.chart{display:flex;gap:6px;align-items:flex-end;height:170px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.chart .bw{flex:1;width:100%;display:flex;align-items:flex-end;background:rgba(0,40,80,.4);border:1px solid rgba(0,180,255,.25)}
.chart .bw i{display:block;width:100%;background:linear-gradient(0deg,#0070c0,#4fd1ff);box-shadow:0 0 10px var(--blue);transition:height .9s cubic-bezier(.2,.8,.2,1);height:0}
.chart em{font:700 9px 'Orbitron';font-style:normal;color:var(--blue2)}
.chart small{font:700 9px 'Orbitron';letter-spacing:.1em}

/* INTRO */
.intro{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:20px}
.sys{font:900 clamp(22px,6vw,34px) 'Orbitron';color:var(--blue2);text-shadow:var(--glow);letter-spacing:.25em}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{opacity:.25}}
.tw{font:600 clamp(18px,4.5vw,24px) 'Rajdhani';white-space:pre-line;min-height:3.2em;max-width:520px}
.tw::after{content:"\25AE";color:var(--blue2);animation:blink .8s steps(2,start) infinite}
.formwin{max-width:480px;margin:6vh auto 0}

/* TOASTS / MODAL / FX */
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(92vw,440px);z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:rgba(3,14,34,.97);border:1px solid var(--blue);box-shadow:var(--glow);padding:10px 14px;animation:tin .35s ease-out;cursor:pointer}
.toast .t{font:700 11px 'Orbitron';color:var(--blue2);letter-spacing:.14em;margin-bottom:3px}
.toast .m{font-size:1em;overflow-wrap:anywhere}
.toast.pen{border-color:var(--red);box-shadow:0 0 14px rgba(255,59,87,.6)}
.toast.pen .t{color:var(--red)}
.toast.lv{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,74,.6)}
.toast.lv .t{color:var(--gold);font-size:14px}
.toast.ok .t{color:var(--green)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#modal{position:fixed;inset:0;z-index:950;background:rgba(0,4,12,.8);display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.dlg{width:min(100%,460px);max-height:100%;overflow-y:auto;background:#06142c;border:1px solid var(--blue);box-shadow:var(--glow);padding:16px;animation:tin .25s ease-out}
.dlg h3{font-size:14px;color:var(--blue2);margin-bottom:12px;text-shadow:var(--glow)}
.dlg p{margin-bottom:14px}
#flash{position:fixed;inset:0;z-index:960;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(0,180,255,.5) 40%,transparent 75%);opacity:0}
#flash.on{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.shake{animation:shake .55s}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
#arise{position:fixed;inset:0;z-index:970;background:rgba(2,0,12,.94);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;animation:fadein .4s}
#arise b{font:900 clamp(40px,14vw,92px) 'Orbitron';letter-spacing:.2em;color:#b58cff;text-shadow:0 0 20px #7a3dff,0 0 60px #5b1fff;animation:arise 1.6s ease-out}
@keyframes arise{0%{opacity:0;transform:scale(.6);filter:blur(10px)}50%{opacity:1;filter:blur(0)}100%{transform:scale(1.08)}}
.edge-red{box-shadow:inset 0 0 80px rgba(255,0,40,.35)}
/* HARD MODE: danger vignette, banners, boot screen, audio controls */
body.danger::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:899;box-shadow:inset 0 0 90px rgba(255,0,40,.28);animation:pulsered 2.4s ease-in-out infinite}
@keyframes pulsered{50%{box-shadow:inset 0 0 150px rgba(255,0,40,.5)}}
#flash.red{background:radial-gradient(circle,rgba(255,60,80,.8),rgba(120,0,20,.55) 45%,transparent 75%)}
.rk{color:var(--red);font-style:normal;font-weight:700}
.bar.debt span{color:var(--red)}
.banner{position:fixed;inset:0;z-index:965;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none;text-align:center;animation:bannerlife 2.6s forwards}
.banner b{font:900 clamp(34px,11vw,84px) 'Orbitron',sans-serif;letter-spacing:.16em}
.banner small{font:700 clamp(14px,4vw,24px) 'Orbitron',sans-serif;letter-spacing:.3em;color:var(--text)}
.banner.up{background:radial-gradient(circle,rgba(255,200,60,.16),transparent 65%)}
.banner.up b{color:var(--gold);text-shadow:0 0 18px #ffb300,0 0 60px #ff8a00}
.banner.down{background:radial-gradient(circle,rgba(70,0,12,.88),rgba(0,0,0,.92))}
.banner.down b{color:var(--red);text-shadow:0 0 20px #ff1f45,0 0 60px #900;animation:glitch .45s steps(2) 4}
@keyframes bannerlife{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.04)}80%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-6px,2px);filter:hue-rotate(40deg)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-2px);filter:hue-rotate(-40deg)}100%{transform:translate(0)}}
#boot{position:fixed;inset:0;z-index:990;border:0;background:radial-gradient(ellipse at 50% 30%,#0b2a52,#02050c 70%);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;cursor:pointer;transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}
#boot p{font:700 13px 'Orbitron',sans-serif;letter-spacing:.3em;color:var(--dim);text-align:center}
#boot small{color:var(--dim);text-align:center}
#mus{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:80;width:40px;height:40px;border:1px solid var(--blue);background:rgba(3,14,34,.85);color:var(--blue2);font-size:20px;line-height:1;cursor:pointer;box-shadow:var(--glow);border-radius:2px}
#mus[hidden]{display:none}
#mus.off{color:var(--dim);border-color:rgba(125,155,192,.5);box-shadow:none;text-decoration:line-through}
/* UNPREDICTABLE REWARDS: rarity colours (grey, blue, purple, gold), reveal glow, alerts */
.rar-common{--rc:#9db0c4;--rcg:rgba(157,176,196,.16)}
.rar-rare{--rc:#3d9bff;--rcg:rgba(61,155,255,.2)}
.rar-epic{--rc:#a06bff;--rcg:rgba(160,107,255,.22)}
.rar-legendary{--rc:#ffd24a;--rcg:rgba(255,210,74,.24)}
.rc{color:var(--rc)}
.card.item{border-color:var(--rc);box-shadow:inset 3px 0 0 var(--rc)}
.card.item.rar-epic{box-shadow:inset 3px 0 0 var(--rc),0 0 10px rgba(160,107,255,.3)}
.card.item.rar-legendary{box-shadow:inset 3px 0 0 var(--rc),0 0 14px rgba(255,210,74,.4)}
.iico{flex:0 0 44px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rc,var(--blue));color:var(--rc,var(--blue2));background:var(--rcg,rgba(0,120,220,.12))}
.iico.big{width:96px;height:96px;flex:none;position:relative;box-shadow:0 0 28px var(--rc)}
.dlg.loot{position:relative;border-color:var(--rc);box-shadow:0 0 34px var(--rc),inset 0 0 40px var(--rcg);background:radial-gradient(ellipse at 50% 0%,var(--rcg),#06142c 70%)}
.dlg.loot.rar-legendary{animation:tin .25s ease-out,lootpulse 1.6s ease-in-out .3s infinite}
@keyframes lootpulse{50%{box-shadow:0 0 60px var(--rc),inset 0 0 60px var(--rcg)}}
.rays{position:relative;display:flex;justify-content:center;padding:18px 0 6px}
.rays::before{content:"";position:absolute;width:200px;height:200px;left:50%;top:50%;margin:-100px 0 0 -100px;border-radius:50%;opacity:.9;
  background:conic-gradient(transparent,var(--rcg),transparent 20%,var(--rcg),transparent 45%,var(--rcg),transparent 70%,var(--rcg),transparent);animation:spin 7s linear infinite}
.dlg.rar-common .rays::before{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lootstats{display:flex;flex-direction:column;align-items:center;gap:4px}
.lootstats div{font:700 14px 'Orbitron',sans-serif;letter-spacing:.06em;color:var(--green);text-shadow:0 0 8px rgba(61,255,165,.4)}
.banner.legend{background:radial-gradient(circle,rgba(255,210,74,.3),rgba(20,10,0,.9))}
.banner.legend b{color:var(--gold);text-shadow:0 0 20px #ffb300,0 0 70px #ff8a00;font-size:clamp(30px,9vw,70px)}
.banner.hid{background:radial-gradient(circle,rgba(110,40,200,.35),rgba(4,0,16,.92))}
.banner.hid b{font-size:clamp(22px,6.5vw,52px);line-height:1.2;padding:0 14px;color:#c9a6ff;text-shadow:0 0 18px #7a3dff,0 0 50px #5b1fff;animation:blink .5s steps(2,start) infinite}
.banner.hid small{max-width:92vw;padding:0 14px;overflow-wrap:anywhere}
.banner.event{background:radial-gradient(circle,rgba(255,120,30,.28),rgba(20,0,10,.92))}
.banner.event b{color:var(--orange);text-shadow:0 0 20px #ff6a00,0 0 60px #ff2a00;font-size:clamp(28px,9vw,72px)}
.win.event{border-color:var(--orange);box-shadow:0 0 14px rgba(255,154,61,.55),inset 0 0 30px rgba(255,100,0,.1);animation:evpulse 2.2s ease-in-out infinite}
.win.event::before,.win.event::after{border-color:var(--orange)}
.win.event>h2{color:var(--orange);border-color:rgba(255,154,61,.35);text-shadow:0 0 8px rgba(255,154,61,.6)}
@keyframes evpulse{50%{box-shadow:0 0 26px rgba(255,154,61,.85),inset 0 0 40px rgba(255,100,0,.18)}}
.win.hid{border-color:var(--purple);animation:hidpulse 1.4s ease-in-out infinite}
.win.hid::before,.win.hid::after{border-color:var(--purple)}
.win.hid>h2{color:#c9a6ff;border-color:rgba(160,107,255,.4);text-shadow:0 0 8px rgba(160,107,255,.6)}
@keyframes hidpulse{50%{box-shadow:0 0 22px rgba(160,107,255,.9),inset 0 0 30px rgba(120,60,255,.2)}}
/* LONG-TERM PROGRESSION: job trials, living shadows, active skills, rebirth */
.banner.trial{background:radial-gradient(circle,rgba(0,180,255,.26),rgba(0,6,20,.92))}
.banner.trial b{font-size:clamp(24px,7.5vw,60px);color:var(--blue2);text-shadow:0 0 18px #00b4ff,0 0 56px #0077c8}
.banner.class{background:radial-gradient(circle,rgba(160,107,255,.34),rgba(8,0,24,.94))}
.banner.class b{font-size:clamp(28px,8.5vw,72px);color:#d9c2ff;text-shadow:0 0 20px #7a3dff,0 0 70px #5b1fff}
.banner.rebirth{background:radial-gradient(circle,rgba(255,244,200,.42),rgba(255,160,30,.16) 38%,rgba(6,0,16,.96))}
.banner.rebirth b{font-size:clamp(26px,9vw,76px);color:#fff;letter-spacing:.2em;text-shadow:0 0 24px var(--gold),0 0 90px #ff8a00}
.win.trial{border-color:var(--blue2)}
.win.rebirth{border-color:var(--gold);animation:rbpulse 2.6s ease-in-out infinite}
.win.rebirth::before,.win.rebirth::after{border-color:var(--gold)}
.win.rebirth>h2{color:var(--gold);border-color:rgba(255,210,74,.35);text-shadow:0 0 8px rgba(255,210,74,.6)}
@keyframes rbpulse{0%,100%{box-shadow:0 0 14px rgba(255,210,74,.45),inset 0 0 30px rgba(255,170,0,.08)}50%{box-shadow:0 0 28px rgba(255,210,74,.85),inset 0 0 40px rgba(255,170,0,.18)}}
.pips{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 10px}
.pips i{width:20px;height:20px;border:1px solid var(--blue);background:rgba(0,40,80,.4)}
.pips i.on{background:var(--blue2);box-shadow:var(--glow)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.roles .btn{padding:8px 6px;font-size:11px}
.btn.on{background:rgba(255,210,74,.2);box-shadow:0 0 10px rgba(255,210,74,.4)}
.tm{font:700 12px 'Orbitron',sans-serif;color:var(--blue2)}
@media(max-width:480px){#nav button{font-size:7px;letter-spacing:0}#nav button .ic{font-size:17px}}
input[type=range]{padding:0;min-height:30px;accent-color:var(--blue);background:transparent;border:0;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
/* REAL FITNESS TRACKING: records, workout mode, weekly scaling and report */
.banner.record{background:radial-gradient(circle,rgba(61,255,165,.24),rgba(0,14,10,.92))}
.banner.record b{font-size:clamp(30px,10vw,76px);color:var(--green);text-shadow:0 0 20px #00ff9c,0 0 64px #00b86b}
.trend{display:block;width:100%;height:auto;max-height:80px;margin:6px 0 2px}
.trend polyline{fill:none;stroke:var(--blue2);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--blue))}
.trend circle{fill:var(--blue2)}
.trend circle.best{fill:var(--gold)}
.trend line{stroke:rgba(255,210,74,.4);stroke-width:1;stroke-dasharray:3 3}
.recrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.recrow b{font:900 20px 'Orbitron',sans-serif;color:var(--gold);text-shadow:0 0 8px rgba(255,210,74,.4)}
.verdict{margin:12px 0;padding:10px 12px;border-left:3px solid var(--blue2);background:rgba(0,60,120,.2);font:600 1.08em 'Rajdhani',sans-serif;font-style:italic}
.verdict small{font:700 10px 'Orbitron',sans-serif;font-style:normal;letter-spacing:.2em;color:var(--dim)}
.verdict.t-harsh,.verdict.t-poor,.verdict.t-idle{border-color:var(--red);background:rgba(60,0,15,.3);color:#ffb3bf}
.verdict.t-great,.verdict.t-elite{border-color:var(--gold);background:rgba(60,45,0,.25);color:#ffe9a8}
textarea{display:block;width:100%;margin-top:10px;padding:9px 10px;font:600 14px 'Rajdhani',sans-serif;color:var(--text);background:rgba(0,20,45,.9);border:1px solid var(--blue);border-radius:2px}
.btn.sq.off{opacity:.45;text-decoration:line-through}
.wk{position:fixed;inset:0;z-index:940;display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  background:radial-gradient(ellipse at 50% 0%,#14356b 0%,#070e22 55%,#02050c 100%);overflow-y:auto;overscroll-behavior:contain;animation:fadein .25s ease-out}
.wk.rest{background:radial-gradient(ellipse at 50% 0%,#0b4a39 0%,#05150f 58%,#02050c 100%)}
.wk.done{background:radial-gradient(ellipse at 50% 0%,#3d3009 0%,#130e02 58%,#02050c 100%)}
.wk-top{display:flex;align-items:center;gap:10px}
.wk-name{flex:1;min-width:0;text-align:center;font:900 clamp(15px,4.6vw,22px) 'Orbitron',sans-serif;letter-spacing:.08em;color:var(--blue2);text-shadow:var(--glow);overflow-wrap:anywhere}
.wk-sub{text-align:center;color:var(--dim);font-size:.95em}
.wk-info{display:flex;justify-content:space-between;gap:8px;font:700 11px 'Orbitron',sans-serif;letter-spacing:.14em;color:var(--dim)}
.wk-info b{color:var(--text)}
.wk-tap{flex:1 1 auto;min-height:34vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px solid var(--blue);background:rgba(0,70,140,.18);
  box-shadow:var(--glow),inset 0 0 60px rgba(0,150,255,.18);border-radius:2px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:background .08s,transform .08s}
.wk-tap:active,.wk-tap.pop{background:rgba(0,180,255,.32);transform:scale(.985)}
.wk-tap.hit{border-color:var(--green);box-shadow:0 0 18px rgba(61,255,165,.6),inset 0 0 60px rgba(61,255,165,.18)}
.wk-tap b{font:900 clamp(96px,36vw,230px) 'Orbitron',sans-serif;line-height:1;color:#fff;text-shadow:var(--glow);pointer-events:none}
.wk-tap small{font:700 12px 'Orbitron',sans-serif;letter-spacing:.3em;pointer-events:none}
.wk-clock{flex:1 1 auto;min-height:30vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.wk-clock b{font:900 clamp(64px,24vw,170px) 'Orbitron',sans-serif;line-height:1;color:#fff;text-shadow:var(--glow);font-variant-numeric:tabular-nums}
.wk-clock small{font:700 13px 'Orbitron',sans-serif;letter-spacing:.3em;color:var(--dim)}
.wk.rest .wk-clock b{color:var(--green);text-shadow:0 0 10px rgba(61,255,165,.6),0 0 30px rgba(61,255,165,.3)}
.wk-clock b.low{color:var(--red);text-shadow:0 0 14px rgba(255,59,87,.7);animation:blink .5s steps(2,start) infinite}
.wk-sets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:30px}
.wk-sets i{font:700 12px 'Orbitron',sans-serif;font-style:normal;padding:5px 9px;border:1px solid rgba(0,180,255,.5);color:var(--blue2);background:rgba(0,60,120,.25)}
.wk-sets i.cur{border-color:var(--gold);color:var(--gold)}
.wk-bot{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.wk-stat{font:700 10px 'Orbitron',sans-serif;letter-spacing:.14em;color:var(--dim);text-align:center;min-height:14px}
.wk .btn.big{min-height:56px;font-size:14px}
.wk label{margin:0}
.btn.ready{box-shadow:0 0 14px rgba(61,255,165,.6);animation:wkglow 1.2s ease-in-out infinite}
@keyframes wkglow{50%{box-shadow:0 0 28px rgba(61,255,165,1)}}
</style>
</head>

function tone(f, t, dur, o={}){

  if(o.det) osc.detune.value = o.det;
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + a);
  g.gain.setValueAtTime(v, t + d);
  g.gain.exponentialRampToValueAtTime(.0001, t + d + r);

    node.connect(fl); node = fl;

}

  if(o.to) fl.frequency.exponentialRampToValueAtTime(Math.max(30, o.to), t + dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + a);
  g.gain.setValueAtTime(v, t + Math.max(a, dur));
  g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(a, dur) + r);

function scheduleBar(t){
  const M = MOODS[AUDIO.mood] || MOODS.calm, B = AUDIO.musBus;
  const beat = 60/M.bpm, barLen = beat*4, n = AUDIO.bar++, ch = M.prog[n % M.prog.length];
  ch.forEach(m => {
    tone(mtof(m),t,barLen,{type:'sawtooth',vol:M.pad,atk:1.4,rel:1.6,det:-8,lp:M.lp*.4,lpTo:M.lp,bus:B});
    tone(mtof(m),t,barLen,{type:'sawtooth',vol:M.pad,atk:1.4,rel:1.6,det:8,lp:M.lp*.4,lpTo:M.lp,bus:B});
  });
  tone(mtof(ch[0]-24),t,barLen,{vol:.14,atk:.5,rel:1.2,bus:B});                       // sub bass
  M.drums.forEach((v,i) => { if(v) kick(t + i*beat/2, v); });
  M.snare.forEach(i => snare(t + i*beat/2, 1));
  (M.hat || []).forEach(i => noise(t + i*beat/2, .02, {from:7000,q:.8,vol:.05,rel:.04,bus:B}));
  for(let i=0;i<8;i++){ if(Math.random() < M.arp) bell(mtof(ch[(i+n)%3] + (i%4===3 ? 36 : 24)), t + i*beat/2, M.arpVol, 1.8, B); }
  return barLen;
}

/* particles */
(function fx(){
  const c = $('#fx'), x = c.getContext('2d'); let w, h; const ps = [];
  function rs(){ w = c.width = innerWidth; h = c.height = innerHeight; }
  addEventListener('resize', rs); rs();
  const n = Math.min(50, Math.floor(w*h/22000));
  for(let i=0;i<n;i++) ps.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.6+.4, v:Math.random()*.35+.1, a:Math.random()*.5+.2});
  function step(){
    x.clearRect(0,0,w,h);
    for(const p of ps){ p.y -= p.v; if(p.y < -5){ p.y = h+5; p.x = Math.random()*w; } x.beginPath(); x.fillStyle = 'rgba(79,209,255,'+p.a+')'; x.arc(p.x,p.y,p.r,0,6.283); x.fill(); }
    requestAnimationFrame(step);
  }
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) step();
})();

/* =========================================================
   GAME LOGIC
   ========================================================= */
function gainStat(k, n){
  state.stats[k] += n;
  if(k==='vit') state.hp += n*CONFIG.hpPerVit;
  if(k==='int') state.mp += n*CONFIG.mpPerInt;
}
function addXp(xp){
  state.xp += xp;
  const t = dkey();
  state.history[t] = (state.history[t]||0) + xp;
  state.totals.xpEarned += xp;
  let gained = 0; const from = state.level;
  while(state.xp >= CONFIG.xpNeeded(state.level)){
    state.xp -= CONFIG.xpNeeded(state.level);
    state.level++; state.points += CONFIG.pointsPerLevel; gained++;
  }
  if(gained){
    state.hp = maxHp(); state.mp = maxMp();
    wkStat().gained += gained;
    banner('up', 'LEVEL UP', 'LV '+from+' \u2192 '+state.level);
    notify('LEVEL UP!', 'You reached Level '+state.level+'. +'+(gained*CONFIG.pointsPerLevel)+' stat points.', 'lv', 'levelup');
    Remind.celebrate();
    if(rankOf(state.level) !== rankOf(from)) notify('RANK UP', 'You are now '+rankLabel(rankOf(state.level))+'.', 'lv', 'acquire');
    trialSync();                                      // reaching a trial level opens its job-change trial
  }
}
function touchStreak(){
  const t = dkey();
  trialCredit();                                      // a trial day is credited once per active day
  if(state.lastActive === t) return;
  state.streak = (state.lastActive === addDays(t,-1)) ? state.streak+1 : 1;
  state.lastActive = t;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  { const W = wkStat(); W.streak = Math.max(W.streak, state.streak); }
  if(state.streak % 7 === 0){
    state.arise++;
    notify('STREAK '+state.streak, 'A shadow stirs... +1 ARISE attempt.', 'ok');
  }
}
function questStatus(q){
  const t = dkey();
  const same = d => d && (q.repeat==='daily' ? d===t : q.repeat==='weekly' ? weekKey(d)===weekKey(t) : true);
  if(q.repeat === 'once'){ if(q.done) return 'done'; if(q.failedOn) return 'failed'; return 'open'; }
  if(same(q.lastDone)) return 'done';
  if(same(q.failedOn)) return 'failed';
  return 'open';
}
/* ---------- PENALTIES: negative XP, fail streaks and level loss ---------- */
const nextFailStreak = () => state.failStreak + (state.lastFailDay === dkey() ? 0 : 1);
const escMult = (fs = state.failStreak) => 1 + Math.min(fs, CONFIG.penalty.escalateCap) * CONFIG.penalty.escalate;
function penaltyXp(baseXp, fs = state.failStreak, day){      // day: which day's event applies (default today)
  const P = CONFIG.penalty;
  return Math.round(Math.max(P.xpMin, baseXp*P.xpMult, CONFIG.xpNeeded(state.level)*P.lvlPct) * escMult(fs) * (1 - penCut()) * eventPenMult(day));
}
function registerFailDay(day){ if(state.lastFailDay !== day){ state.lastFailDay = day; state.failStreak++; } }
const snapLevel = () => ({ lv: state.level, rank: rankOf(state.level) });
function clampVitals(){ state.hp = clamp(state.hp, 1, maxHp()); state.mp = clamp(state.mp, 0, maxMp()); }
function loseLevelPoints(){                       // every level lost takes its stat points back, then strips spent ones
  let debt = CONFIG.pointsPerLevel;
  const take = Math.min(state.points, debt); state.points -= take; debt -= take;
  while(debt > 0){
    const k = STATS.reduce((a,b) => state.alloc[b] > state.alloc[a] ? b : a, STATS[0]);
    if(state.alloc[k] <= 0) break;
    state.alloc[k]--; state.stats[k] = Math.max(1, state.stats[k]-1); debt--;
  }
  pending = { str:0, agi:0, vit:0, int:0, sense:0 };
}
function loseXp(n){                               // XP goes negative, and negative XP eats whole levels
  state.xp -= n;
  const W = wkStat(); W.lostXp += Math.max(0, n);
  while(state.xp < 0 && state.level > 1){
    state.level--; state.xp += CONFIG.xpNeeded(state.level); loseLevelPoints(); W.lost++;
  }
  if(state.level === 1) state.xp = Math.max(state.xp, -CONFIG.penalty.debtMax);   // at level 1 it becomes XP debt
  clampVitals();
}
function loseLevels(k){                           // the System purge: whole levels, progress wiped
  let n = 0;
  while(n < k && state.level > 1){ state.level--; loseLevelPoints(); n++; }
  if(n){ state.xp = 0; wkStat().lost += n; }
  clampVitals();
  return n;
}
function reportDrop(s){
  if(state.level >= s.lv) return;
  const rk = rankOf(state.level);
  banner('down', 'LEVEL DOWN', 'LV '+s.lv+' \u2192 '+state.level);
  notify('LEVEL LOST', 'You fell from Level '+s.lv+' to Level '+state.level+'.'+(rk !== s.rank ? ' Rank downgraded to '+rankLabel(rk)+'.' : '')+' Stat points were taken back.', 'pen', 'leveldown');
}
function applyPenalty(baseXp, quiet, day){
  const P = CONFIG.penalty, snap = snapLevel();
  if(blockPenalty('Penalty')) return { lost:0, g:0, purged:0, blocked:true };   // Shadow Step or a Ward shadow absorbs it
  const lost = penaltyXp(baseXp, state.failStreak, day);
  loseXp(lost);
  let purged = 0;
  if(state.failStreak >= P.purgeAt) purged = loseLevels(Math.min(P.purgeMax, Math.floor(state.failStreak / P.purgeAt)));
  const m = escMult() * eventPenMult(day);
  const g = Math.min(state.gold, Math.max(P.goldMin, Math.round(state.gold*P.goldPct*m)));
  state.gold -= g;
  state.fatigue = Math.min(100, state.fatigue + P.fatigue);
  state.hp = Math.max(1, state.hp - Math.round(maxHp()*Math.min(.6, P.hpPct*m)));
  if(state.failStreak >= P.shadowFleeAt && state.shadows.length){
    const gone = state.shadows.pop();
    notify('SHADOW LOST', gone.name+' abandons the weak. The System does not forgive.', 'pen');
  }
  clampVitals();
  if(!quiet) reportDrop(snap);
  return { lost, g, purged };
}
function issuePenalty(date){
  const mult = 1 + Math.floor(Math.max(0, state.failStreak - 1) / 2);
  state.penalties.push({ id:uid(), task:pick(CONFIG.penaltyTasks), date, mult });
  state.penalties = state.penalties.slice(-5);
}
function failWarn(){                              // red warning window at the top of STATUS
  const fs = state.failStreak, P = CONFIG.penalty; if(fs < 1) return '';
  const msg = fs >= P.purgeAt ? 'The System is stripping whole levels from you on every failure.'
    : fs === P.purgeAt-1 ? 'One more failed day and the System starts stripping whole levels.'
    : 'Fail again and every penalty grows.';
  return '<div class="win red"><h2>[ WARNING ]<span class="red-t">FAIL STREAK '+fs+'</span></h2>'
    +'<p>All penalties are now <b class="red-t">&times;'+escMult().toFixed(1)+'</b>. '+msg+'</p>'
    +'<p class="hint">Clear every daily quest in one day to reset it, or finish penalty tasks to lower it by '+P.redeem+'.</p></div>';
}
function failWarnText(q){                         // confirmation text before you fail a quest
  const P = CONFIG.penalty, fs = nextFailStreak(), loss = penaltyXp(questBaseXp(q), fs);
  let t = 'Failing <b>'+esc(q.name)+'</b> costs <b class="red-t">&minus;'+fmt(loss)+' XP</b>, gold, HP and your win streak, and issues a penalty task.';
  if(state.level > 1 && state.xp - loss < 0) t += '<br><br><b class="red-t">This drops you below your current level.</b>';
  if(fs >= P.purgeAt) t += '<br><br><b class="red-t">FAIL STREAK '+fs+': the System will also strip '+Math.min(P.purgeMax, Math.floor(fs/P.purgeAt))+' whole level(s).</b>';
  else if(fs > 1) t += '<br><br>Your fail streak becomes '+fs+' (penalty &times;'+escMult(fs).toFixed(1)+').';
  if(penaltyShield()) t += '<br><br><b class="green-t">A penalty block is ready: the XP, gold and HP loss will be blocked.</b>';
  if(state.trial && (state.trial.days > 0 || state.trial.gate)) t += '<br><br><b class="red-t">Your job-change trial progress will reset.</b>';
  return t;

function completeQuest(id, res){
  const q = state.quests.find(x => x.id===id);
  if(!q || questStatus(q)!=='open') return;
  const t = dkey();
  if(q.kind === 'rest'){
    state.fatigue = 0; state.hp = maxHp(); state.mp = maxMp();
    q.lastDone = t;
    notify('REST COMPLETE', 'Fatigue cleared. HP and MP fully restored.', 'ok', 'rest');
    return afterChange();
  }
  touchStreak();
  const xp = calcQuestXp(q);
  const gold = Math.round(xp*CONFIG.goldRatio*goldMult());
  if(state.boosterCharges > 0) state.boosterCharges--;
  if(state.buffs.bloodlust) state.buffs.bloodlust = 0;   // Bloodlust is spent on this quest (its bonus was already counted above)
  state.fatigue = Math.min(100, state.fatigue + fatGain(q.minutes*CONFIG.fatiguePerMin));
  q.lastDone = t; if(q.repeat==='once') q.done = true;
  state.totals.completed++; wkStat().done++; logQuest(q.id, 1);
  if(q.diff==='A' || q.diff==='S') state.totals.aRank++;
  state.gold += gold;
  notify('QUEST COMPLETE', q.name+': +'+xp+' XP, +'+gold+' G', 'ok', 'quest');
  // permanent stat reward: +1 per 100 XP earned from quests linked to this stat
  state.statXp[q.stat] += xp;
  const pts = Math.floor(state.statXp[q.stat] / CONFIG.statXpPerPoint);
  if(pts > 0){
    state.statXp[q.stat] -= pts*CONFIG.statXpPerPoint;
    gainStat(q.stat, pts);
    notify('STAT UP', STAT_NAME[q.stat]+' +'+pts, 'ok', 'statup');
  }
  const lv0 = state.level;
  addXp(xp);
  shadowsTrain(xp, 1);                                // your shadows earn XP from every quest
  dropLoot({ diff:q.diff }); if(res) applyResult(q, res, xp, lv0);                          // every completed quest rolls for loot
  // all daily quests done -> bonus
  const dailies = state.quests.filter(x => x.repeat==='daily' && x.kind!=='rest');
  if(dailies.length && dailies.every(x => questStatus(x)==='done') && state.dailyBonusDate !== t){
    state.dailyBonusDate = t; state.gold += CONFIG.dailyBonusGold;
    const hadFail = state.failStreak > 0; state.failStreak = 0;
    notify('DAILY QUEST CLEARED', 'All daily quests complete. +'+CONFIG.dailyBonusGold+' G bonus.'+(hadFail ? ' Your fail streak is reset.' : ''), 'lv', 'daily');
  }
  afterChange();
}
function failQuest(id){
  const q = state.quests.find(x => x.id===id);
  if(!q || questStatus(q)!=='open') return;
  const t = dkey(), snap = snapLevel(), hadStreak = state.streak;
  q.failedOn = t;
  state.totals.failed++; wkStat().failed++; logQuest(q.id, 0);
  state.streak = 0;                                   // a failed quest breaks your win streak
  registerFailDay(t);
  const r = applyPenalty(questBaseXp(q), true);
  if(!r.blocked) issuePenalty(t);
  trialFail('You failed a quest.', true);
  notify('QUEST FAILED', q.name+': -'+fmt(r.lost)+' XP, -'+r.g+' G.'+(hadStreak>1 ? ' Your '+hadStreak+'-day streak is gone.' : '')+(state.failStreak>1 ? ' Fail streak: '+state.failStreak+'.' : '')+(r.blocked ? ' The penalty was blocked.' : ' A penalty task was issued.'), r.blocked ? 'info' : 'pen', r.blocked ? 'warn' : undefined);
  reportDrop(snap);
  afterChange();
}
function clearPenalty(id){
  const i = state.penalties.findIndex(p => p.id===id);
  if(i<0) return;
  const p = state.penalties.splice(i,1)[0];
  state.totals.penaltiesCleared++;
  notify('PENALTY CLEARED', 'Completed: '+p.task+(p.mult>1 ? ' \u00D7'+p.mult : '')+'.', 'ok');
  if(state.failStreak > 0){
    state.failStreak = Math.max(0, state.failStreak - CONFIG.penalty.redeem);
    state.lastFailDay = null;
    notify('REDEMPTION', 'Your fail streak dropped to '+state.failStreak+'.', 'ok', 'acquire');
  }
  afterChange();
}
function checkTitles(){
  CONFIG.titles.forEach(t => {
    if(!state.titles.includes(t.name) && t.cond(state)){
      state.titles.push(t.name);
      notify('NOTIFICATION', 'You have acquired a Title: '+t.name, 'lv');
    }
  });
}
function skillLevel(sk){
  const cur = sk.type==='stat' ? state.stats[sk.stat] : state.level;
  return cur >= sk.val ? 1 + Math.floor((cur-sk.val)/10) : 0;
}
function checkSkills(){
  CONFIG.skills.forEach(sk => {
    if(skillLevel(sk) > 0 && !state.skillsSeen.includes(sk.id)){
      state.skillsSeen.push(sk.id);
      notify('SKILL ACQUIRED', sk.name, 'lv');
    }
  });
}
function afterChange(){ checkTitles(); checkSkills(); trialSync(); save(); render(); }

/* gates */
function gateReward(rank){
  const xp = Math.round(CONFIG.diffBase[rank]*CONFIG.gateMult*xpMult(false));
  return { xp, gold: Math.round(xp*CONFIG.goldRatio*goldMult()) };
}
const gateFailXp = rank => Math.round(gateReward(rank).xp / eventXpMult() * CONFIG.gateFailMult * escMult() * (1 - penCut()) * eventPenMult());   // event XP bonus is not part of the loss base
function failGate(auto){
  const g = state.gate; if(!g) return;
  const snap = snapLevel();
  const blocked = blockPenalty('Gate failure');
  const lost = blocked ? 0 : gateFailXp(g.rank);
  if(!blocked){
    loseXp(lost);
    state.fatigue = Math.min(100, state.fatigue + CONFIG.gateFailFatigue);
    state.hp = Math.max(1, state.hp - Math.round(maxHp()*CONFIG.penalty.hpPct*2));
    clampVitals();
  }
  trialGateLost(g.rank);
  state.totals.gatesFailed++;
  state.lastGateWeek = g.week;
  state.gate = null;
  notify('GATE FAILED', (auto?'The gate collapsed. ':'You retreated. ')+g.name+(blocked ? ': the penalty was blocked.' : ': -'+fmt(lost)+' XP.'), blocked ? 'info' : 'pen', 'collapse');
  if(!auto) reportDrop(snap);
}
function clearGate(){
  const g = state.gate; if(!g) return;
  const r = gateReward(g.rank);
  touchStreak();
  state.gold += r.gold;
  state.fatigue = Math.min(100, state.fatigue + fatGain(CONFIG.gateFatigue));
  state.totals.gatesCleared++;
  state.lastGateWeek = g.week; state.gate = null;

  notify('GATE CLEARED', g.name+': +'+r.xp+' XP, +'+r.gold+' G', 'lv', 'victory');
  if(g.rank==='A' || g.rank==='S'){ state.arise++; state.totals.bossClears++; notify('BOSS DEFEATED', 'The boss left a shadow behind. +1 ARISE attempt.', 'ok'); }
  addXp(r.xp);
  shadowsTrain(r.xp, CONFIG.shadowGrowth.gateMult);

/* shadow army */
function attemptArise(){
  if(state.arise < 1) return;
  state.arise--;
  const chance = Math.min(CONFIG.ariseMax, CONFIG.ariseBase + effStat('sense'));
  const ov = document.createElement('div'); ov.id = 'arise';
  ov.innerHTML = '<b>ARISE</b><small class="orb">EXTRACTING SHADOW...</small>';
  document.body.appendChild(ov);
  sfx('arise');
  setTimeout(() => {
    ov.remove();
    if(Math.random()*100 < chance){
      const ranks = ['E','D','C','B','A','S'];
      const tier = Math.min(5, ranks.indexOf(rankOf(state.level)==='N' ? 'S' : rankOf(state.level)));
      const weights = ranks.map((r,i) => Math.max(1, 10 - 3*Math.abs(i-tier)));
      let roll = Math.random()*weights.reduce((a,b)=>a+b,0), rk = 'E';
      for(let i=0;i<ranks.length;i++){ roll -= weights[i]; if(roll<=0){ rk = ranks[i]; break; } }
      const free = CONFIG.shadowNames.filter(n => !state.shadows.some(s => s.name===n));
      const name = free.length ? pick(free) : 'Shadow Soldier #'+(state.shadows.length+1);
      state.shadows.push(makeShadow(name, rk));
      notify('EXTRACTION SUCCESS', name+' ('+rk+'-rank) joins your army. +'+(CONFIG.shadowBonus[rk]*100).toFixed(1)+'% XP.', 'lv', 'ariseOk');
    } else {
      notify('EXTRACTION FAILED', 'The shadow dissipated... Try again.', 'pen', 'ariseFail');
    }
    afterChange();
  }, 1900);
  save(); render();
}

/* =========================================================
   LONG-TERM PROGRESSION: job trials, living shadows, active skills, rebirth
   Everything lives in `state`, so the cloud save carries it.
   ========================================================= */
const BONUS_LABEL = { xp:'XP', gold:'gold', fat:'less fatigue', pen:'less penalty XP', regen:'MP regen', cd:'faster cooldowns', sxp:'shadow XP' };
const classBonusText = b => Object.keys(b).map(k => '+'+pct(b[k])+' '+BONUS_LABEL[k]).join(' &middot; ');
const clock = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return (h ? h+':'+pad(m) : pad(m))+':'+pad(s%60); };

/* ---------- 1. job change trials ---------- */
const trialDef = () => CONFIG.trials[state.jobTier] || null;
function startTrial(){
  const T = trialDef(); if(!T) return;
  const t = dkey(), today = state.lastActive === t && state.streak > 0;       // today may already count
  state.trial = { tier:state.jobTier, days: today ? 1 : 0, last: today ? t : null, gate:false };
  banner('trial', 'JOB CHANGE TRIAL', T.name.toUpperCase(), 3600);
  notify('JOB CHANGE TRIAL', T.days+' active days in a row and a '+T.gate+'-rank Gate. Track it on STATUS.', 'lv', 'trialStart');
}
function trialSync(){                                 // opens the trial when its level is reached, voids it if the level is lost
  const T = trialDef(), tr = state.trial;
  if(!T || state.level < T.lv){
    if(tr && T && (tr.days > 0 || tr.gate)) notify('TRIAL VOID', 'You fell below Level '+T.lv+'. The trial progress is lost.', 'info', 'warn');
    state.trial = null; return;
  }
  if(!tr || tr.tier !== state.jobTier) startTrial();
}
function trialCredit(){                               // called once per active day (quest, gate or hidden quest)
  const tr = state.trial, T = trialDef(); if(!tr || !T) return;
  const t = dkey(); if(tr.last === t) return;
  tr.days = tr.last === addDays(t,-1) ? tr.days + 1 : 1; tr.last = t;
  if(tr.days >= T.days && tr.gate){ trialComplete(); return; }
  notify('TRIAL DAY '+tr.days, tr.days >= T.days ? 'All days done. Now clear a '+T.gate+'-rank Gate.' : tr.days+' / '+T.days+' active days.', 'ok', 'trialDay');
}
function trialFail(why, burnToday){                   // resets the trial's progress. The player's level is not touched.
  const tr = state.trial; if(!tr) return;
  const had = tr.days > 0 || tr.gate;
  tr.days = 0; tr.gate = false; tr.last = burnToday ? dkey() : null;
  if(had) notify('TRIAL FAILED', why+' The trial progress was reset. Your level is safe.', 'info', 'trialFail');
}
function trialGateCleared(rank){
  const tr = state.trial, T = trialDef(); if(!tr || !T || tr.gate || rankIdx(rank) < rankIdx(T.gate)) return;
  tr.gate = true;
  if(tr.days >= T.days) trialComplete();
  else notify('TRIAL OBJECTIVE', 'The '+T.gate+'-rank Gate objective is complete. '+tr.days+' / '+T.days+' days.', 'ok', 'trialDay');
}
function trialGateLost(rank){ const T = trialDef(); if(state.trial && T && rankIdx(rank) >= rankIdx(T.gate)) trialFail('A trial Gate was lost.', false); }
function trialComplete(){
  const T = trialDef(); if(!T) return;
  if(state.jobTier === 0) state.jobPath = STATS.reduce((a,k) => state.stats[k] > state.stats[a] ? k : a, 'str');   // the path follows your top stat
  const cls = CONFIG.classes[state.jobPath][state.jobTier], tier = ++state.jobTier;
  state.job = cls.name; state.trial = null;
  banner('trial', 'TRIAL CLEARED', T.name.toUpperCase(), 2600);
  setTimeout(() => banner('class', cls.name.toUpperCase(), 'CLASS ADVANCED  \u00B7  TIER '+tier+' / '+CONFIG.trials.length, 4800), 2400);
  notify('JOB CHANGE', 'You are now a '+cls.name+'. Permanent bonus: '+classBonusText(cls.bonus).replace(/&middot;/g, '|')+'.', 'lv', 'classUp');
}

/* ---------- 2. living shadow army ---------- */
function makeShadow(name, rank){ return { id:uid(), name, rank, date:dkey(), lv:1, xp:0, role:null, served:0 }; }
const shadowCap = sh => CONFIG.shadowGrowth.maxLevel[sh.rank] || 10;
const shadowNeed = sh => Math.round(CONFIG.shadowGrowth.xpBase * Math.pow(sh.lv, CONFIG.shadowGrowth.xpExp));
function shadowsTrain(xp, kindMult){                  // every shadow earns XP when you complete something
  if(!state.shadows.length) return [];
  const G = CONFIG.shadowGrowth, amount = Math.max(1, Math.round(xp * G.xpShare * (kindMult || 1) * (1 + classBonus().sxp))), up = [];
  state.shadows.forEach(sh => {
    sh.served++;
    if(sh.lv >= shadowCap(sh)) return;
    sh.xp += amount;
    let grew = false;
    while(sh.lv < shadowCap(sh) && sh.xp >= shadowNeed(sh)){ sh.xp -= shadowNeed(sh); sh.lv++; grew = true; }
    if(sh.lv >= shadowCap(sh)) sh.xp = 0;
    if(grew) up.push(sh);
  });
  if(up.length) notify('SHADOW GROWTH', up.length <= 2 ? up.map(s => s.name+' reached Lv '+s.lv).join(', ')+'.' : up.length+' shadows grew stronger.', 'ok', 'shadowUp');
  return up;
}
const roleCount = role => state.shadows.filter(s => s.role === role).length;
const wardShadows = () => state.shadows.filter(s => s.role === 'ward' && s.lv >= CONFIG.shadowGrowth.wardMinLevel);
function wardLeft(){                                  // blocks per week = Ward shadows. A global counter stops role-swapping from adding blocks.
  const used = state.wardWeek === weekKey(dkey()) ? state.wardUsed : 0;
  return Math.max(0, wardShadows().length - used);
}
const penaltyShield = () => state.buffs.stepUntil > Date.now() || wardLeft() > 0;
function blockPenalty(label){                         // true = this penalty is skipped (Shadow Step first, then a Ward)
  const b = state.buffs;
  if(b.stepUntil > Date.now()){ b.stepUntil = 0; notify('SHADOW STEP', 'You slipped past the penalty ('+label+').', 'ok', 'block'); return true; }
  if(wardLeft() > 0){
    const wk = weekKey(dkey()); if(state.wardWeek !== wk){ state.wardWeek = wk; state.wardUsed = 0; }
    state.wardUsed++;
    notify('WARD', wardShadows()[0].name+' absorbed the penalty ('+label+'). One block per Ward each week.', 'ok', 'block');
    return true;
  }
  return false;
}
function setRole(id, role){
  const sh = state.shadows.find(x => x.id === id), G = CONFIG.shadowGrowth; if(!sh) return false;
  if(role && !hasOwn(G.roles, role)) return false;
  if(role && sh.role !== role && roleCount(role) >= G.roles[role].slots){ notify('NO FREE SLOT', G.roles[role].name+' has only '+G.roles[role].slots+' slot(s). Free one first.', 'info', 'deny'); return false; }
  sh.role = role || null; sfx('roleSet'); save(); render();
  return true;
}

/* ---------- 3. MP and active skills ---------- */
function activeDef(id){ return CONFIG.activeSkills.find(a => a.id === id); }
const skillUnlocked = a => state.level >= a.unlock;     // levels lost to penalties lock the skill again
const skillCd = a => Math.round(a.cd * (1 - cdCut()));
const cdLeft = a => Math.max(0, ((state.cooldowns[a.id] || 0) - Date.now()) / 1000);
const mpPerMin = () => maxMp() * CONFIG.mp.regenPct * (1 + classBonus().regen);
function mpRegen(){                                   // time based: it also pays out for the time the app was closed
  const now = Date.now(), M = maxMp();
  if(!(state.mpAt > 0) || now < state.mpAt){ state.mpAt = now; return; }
  if(state.mp < M) state.mp = Math.min(M, state.mp + (now - state.mpAt) / 60000 * mpPerMin());
  state.mpAt = now;
}
function castSkill(id){
  const a = activeDef(id); if(!a) return false;
  mpRegen();
  const deny = msg => { notify(a.name.toUpperCase(), msg, 'info', 'deny'); return false; };
  if(!skillUnlocked(a)) return deny('Requires Level '+a.unlock+'.');
  if(cdLeft(a) > 0) return deny('Cooling down: '+clock(cdLeft(a))+' left.');
  if(a.id === 'secondwind' && state.fatigue <= 0) return deny('You are not fatigued.');
  if(a.id === 'bloodlust' && state.buffs.bloodlust) return deny('Bloodlust is already active.');
  if(a.id === 'shadowstep' && state.buffs.stepUntil > Date.now()) return deny('Shadow Step is already armed.');
  if(state.mp < a.mp) return deny('Not enough MP ('+Math.floor(state.mp)+' / '+a.mp+').');
  state.mp -= a.mp; state.mpAt = Date.now();
  state.cooldowns[a.id] = Date.now() + skillCd(a) * 1000;
  if(a.id === 'secondwind'){ const n = Math.min(a.fatigue, state.fatigue); state.fatigue -= n; notify('SECOND WIND', 'Fatigue -'+Math.round(n)+'.', 'ok', 'secondWind'); }
  if(a.id === 'bloodlust'){ state.buffs.bloodlust = 1; notify('BLOODLUST', 'Your next quest pays +'+Math.round(a.xp*100)+'% XP.', 'ok', 'bloodlust'); }
  if(a.id === 'shadowstep'){ state.buffs.stepUntil = Date.now() + a.ttl * 1000; notify('SHADOW STEP', 'The next penalty within '+Math.round(a.ttl/3600)+' hours will be skipped.', 'ok', 'shadowStep'); }
  afterChange();
  return true;
}
function liveTick(){                                  // runs every second: MP regeneration and countdown timers
  mpRegen();
  const M = maxMp(), mp = Math.min(state.mp, M);
  $$('[data-mp]').forEach(b => { b.firstChild.style.width = clamp(mp/M*100, 0, 100).toFixed(1)+'%'; b.lastChild.textContent = Math.round(mp)+' / '+M; });
  let redo = false;
  $$('[data-t]').forEach(el => {
    const left = (+el.dataset.t - Date.now()) / 1000;
    if(left <= 0){ if(el.dataset.r === '1') redo = true; el.textContent = '00:00'; } else el.textContent = clock(left);
  });
  if(redo) render();
}

/* ---------- 4. rebirth ---------- */
const canRebirth = () => state.level >= CONFIG.rebirth.level;
async function askRebirth(){
  if(!canRebirth()) return;
  const R = CONFIG.rebirth, n = state.rebirths + 1, after = 1 + Math.min(R.multCap, n * R.multPer), maxed = state.rebirths * R.multPer >= R.multCap;
  const ok = await ask('ASCEND? REBIRTH #'+n,
    '<b class="gold-t">Level '+state.level+' &rarr; Level 1.</b><br><br>'
    +'<b class="green-t">You keep:</b> a permanent XP multiplier (&times;'+rebirthMult().toFixed(2)+' &rarr; &times;'+after.toFixed(2)+(maxed ? ', already at the cap' : '')+'), an exclusive title, your Rebirth count, class, stats, gear, gold and shadows.<br><br>'
    +'<b class="red-t">You lose:</b> your level and XP, your fail streak and penalty tasks, trial progress, fatigue and skill cooldowns. Level-locked skills lock again until you climb back.', 'ASCEND', true);
  if(ok && canRebirth()) doRebirth();
}
function doRebirth(){
  const from = state.level;
  state.rebirths++;
  state.level = 1; state.xp = 0;
  state.failStreak = 0; state.lastFailDay = null; state.penalties = [];
  state.fatigue = 0; state.trial = null; state.cooldowns = {}; state.buffs = { bloodlust:0, stepUntil:0 };
  pending = { str:0, agi:0, vit:0, int:0, sense:0 };
  state.hp = maxHp(); state.mp = maxMp(); state.mpAt = Date.now();
  checkTitles();
  const rt = CONFIG.titles.filter(t => t.rebirth && state.rebirths >= t.rebirth).pop();
  if(rt) state.title = rt.name;
  const n = state.rebirths, mult = rebirthMult();
  sfx('rebirth'); flash();                                                     // one long cinematic: three banners over ~10 seconds
  banner('rebirth', 'THE CYCLE ENDS', 'LV '+from+' \u2192 LV 1', 3200);
  setTimeout(() => { flash(); banner('rebirth', 'REBIRTH', 'ASCENSION #'+n, 3400); }, 3300);
  setTimeout(() => { banner('rebirth', 'XP \u00D7'+mult.toFixed(2), rt ? rt.name.toUpperCase() : 'REBORN', 3600); notify('REBORN', 'Rebirth #'+n+'. Permanent XP \u00D7'+mult.toFixed(2)+'.', 'lv', 'silent'); }, 6700);
  afterChange();
}

/* day rollover: penalties for missed dailies, gate expiry, recovery */
function rollover(){
  const today = dkey();
  if(state.lastDate === today) return false;
  statDay = state.lastDate;                         // penalties below belong to the days that were missed
  const P = CONFIG.penalty, snap = snapLevel();
  const gap = Math.min(diffDays(state.lastDate, today), 365);
  state.fatigue = Math.max(0, state.fatigue - CONFIG.fatigueDaily*gap);
  state.hp = maxHp(); state.mp = maxMp();
  if(state.lastActive && diffDays(state.lastActive, today) > 1) state.streak = 0;
  if(state.gate && state.gate.week !== weekKey(today)) failGate(true);
  // penalty tasks left undone overnight cost more XP
  const stale = state.penalties.filter(p => p.date < today);
  if(stale.length){
    const cost = Math.round(stale.length * P.ignoredXp * Math.min(gap, P.maxDays) * eventPenMult(state.lastDate));
    loseXp(cost);
    notify('PENALTY IGNORED', stale.length+' penalty task(s) left undone. -'+fmt(cost)+' XP.', 'pen');
  }
  // every missed day is a failed day: fail streak grows, penalties escalate
  let missedDays = 0, events = 0, lx = 0, lg = 0;
  for(let i=0;i<gap;i++){
    const day = addDays(state.lastDate, i);
    statDay = day;
    const dl = state.quests.filter(q => q.repeat==='daily' && q.kind!=='rest' && q.created<=day);
    if(!dl.length) continue;
    const miss = dl.filter(q => q.lastDone!==day && q.failedOn!==day);
    if(miss.length){
      miss.forEach(q => { logQuest(q.id, 0, day); wkStat(day).failed++; });
      missedDays++; registerFailDay(day);
      if(events < P.maxDays){
        events++;
        const r = applyPenalty(miss.reduce((a,q) => a + questBaseXp(q), 0), true, day);   // a missed Double Dungeon day costs double
        lx += r.lost; lg += r.g;
        if(!r.blocked) issuePenalty(today);
      }
    } else if(dl.every(q => q.lastDone===day)) state.failStreak = 0;
  }
  statDay = null;
  if(state.trial && (missedDays > 0 || (state.trial.days > 0 && state.trial.last !== addDays(today,-1)))) trialFail(missedDays > 0 ? 'You missed daily quests.' : 'A day went by with no progress.', false);
  if(missedDays > 0){
    state.streak = 0;
    state.totals.failed += events;
    notify('PENALTY QUEST', 'You missed daily quests on '+missedDays+' day(s). -'+fmt(lx)+' XP, -'+lg+' G. Fail streak: '+state.failStreak+'. Clear your penalty tasks before midnight.', 'pen');
  }
  state.lastDate = today;
  reportDrop(snap);
  rollEvent(today);                 // new morning: maybe a Double Dungeon day
  ensureHiddenPlan();               // new morning: plan today's hidden quests
  trialSync();
  save();
  return true;
}

/* =========================================================
   UNPREDICTABLE REWARDS: LOOT, INVENTORY, HIDDEN QUESTS, DOUBLE DUNGEON
   Everything below lives in `state`, so the cloud save carries it.
   ========================================================= */
const bagCap = () => CONFIG.loot.bagSize + state.bagExp * CONFIG.loot.bagExpandBy;
const bagFull = () => state.bag.length >= bagCap();
const rarIdx = r => RAR.indexOf(r);
const pct = v => (v*100).toFixed(1).replace(/\.0$/, '') + '%';

function sanitizeItem(it){                          // validates items from saves and imports
  if(!it || typeof it !== 'object') return null;
  if(!LOOT_TYPES.includes(it.type) || !RAR.includes(it.rarity) || !Array.isArray(it.bonuses)) return null;
  const bonuses = [];
  it.bonuses.slice(0, 2).forEach(b => {
    if(!b || !BONUS_KINDS.includes(b.k)) return;
    const v = +b.v; if(!isFinite(v) || v <= 0) return;
    if(b.k === 'stat'){ if(STATS.includes(b.stat)) bonuses.push({ k:'stat', stat:b.stat, v:clamp(Math.round(v), 1, 50) }); }
    else bonuses.push({ k:b.k, v:Math.min(1, v) });
  });
  if(!bonuses.length) return null;
  return { id:String(it.id || uid()).slice(0, 24), name:String(it.name || 'Mystery Item').slice(0, 40), type:it.type, rarity:it.rarity, bonuses,
    flavor:String(it.flavor || '').slice(0, 120), lvl:Math.max(1, Math.floor(+it.lvl || 1)) };
}
function sanitizeHidden(h){
  if(!h || typeof h !== 'object' || !isFinite(+h.deadline) || !isFinite(+h.created)) return null;
  return { id:String(h.id || uid()).slice(0, 24), text:String(h.text || 'Surprise task').slice(0, 100), stat:STATS.includes(h.stat) ? h.stat : 'str',
    diff:CONFIG.diffBase[h.diff] ? h.diff : 'E', minutes:clamp(+h.minutes || 5, 0, 600), created:+h.created, deadline:+h.deadline, limit:clamp(+h.limit || 60, 1, 600) };
}

/* ---------- loot rolls ---------- */
function lootChance(diff){
  const L = CONFIG.loot;
  const c = L.baseChance + (L.chanceByDiff[diff] || 0) + Math.min(L.chanceStreakMax, currentStreak() * L.chancePerStreak);
  return clamp(Math.min(L.chanceCap, c) * eventLootMult(), 0, 1);
}
function lootLuck(diff, extra=0){
  const L = CONFIG.loot;
  const lk = (L.luckByDiff[diff] || 0) + Math.min(L.luckStreakMax, currentStreak() * L.luckPerStreak)
    + Math.min(L.luckBossMax, (state.totals.bossClears || 0) * L.luckPerBossClear) + extra;
  return lk * eventLootMult();
}
function rarityOdds(luck){
  const L = CONFIG.loot, w = RAR.map(r => L.weights[r] * (1 + luck * L.luckScale[r])), sum = w.reduce((a,b) => a+b, 0), o = {};
  RAR.forEach((r,i) => o[r] = w[i] / sum);
  return o;
}
function rollRarity(luck){
  const odds = rarityOdds(luck); let roll = Math.random();
  for(const r of RAR){ roll -= odds[r]; if(roll < 0) return r; }
  return RAR[RAR.length-1];
}
function makeItem(rarity, type){
  const L = CONFIG.loot;
  type = type || pick(LOOT_TYPES);
  const kinds = L.typeBonuses[type].slice(), [lo, hi] = L.bonusCount[rarity];
  let n = lo + Math.floor(Math.random() * (hi - lo + 1)); const bonuses = [];
  while(n-- > 0 && kinds.length){
    const k = kinds.splice(Math.floor(Math.random() * kinds.length), 1)[0];
    const v = L.bonusBase[k] * L.bonusMult[rarity] * (1 + (Math.random()*2 - 1) * L.bonusSpread);
    if(k === 'stat') bonuses.push({ k, stat:pick(STATS), v:Math.max(1, Math.round(v)) });
    else bonuses.push({ k, v:Math.max(.005, Math.round(v*200)/200) });
  }
  return { id:uid(), name:pick(L.prefixes[rarity]) + ' ' + pick(L.names[type]), type, rarity, bonuses, flavor:pick(L.flavor[rarity]), lvl:state.level };
}
function rollLoot(o){
  o = o || {};
  const diff = o.diff || 'E';
  if(!o.guaranteed && Math.random() >= lootChance(diff)) return null;
  return makeItem(rollRarity(lootLuck(diff, o.luck || 0)));
}
function dropLoot(o){ const it = rollLoot(o); if(it) grantLoot(it); return it; }
function sellValue(it){ return Math.round(CONFIG.loot.sell[it.rarity] * (1 + it.lvl * CONFIG.loot.sellPerLevel)); }
function grantLoot(it){
  state.lootPending.push(it); state.totals.lootFound++;
  while(state.lootPending.length > CONFIG.loot.pendingMax){ const old = state.lootPending.shift(); state.gold += sellValue(old); notify('LOOT OVERFLOW', old.name+' was auto-sold.', 'info'); }
  if(bagFull()) notify('BAG FULL', 'Your bag is full. Sell or dismantle something to keep new drops.', 'info');
  queueReveal();
}

/* ---------- reveal ---------- */
let revealOpen = false, revealTimer = null, revealSkip = {};
function queueReveal(delay){
  if(revealOpen || revealTimer) return;
  let wait = delay;
  if(wait == null){                                   // let the sounds already playing finish first
    const c = AUDIO.ctx;
    wait = (c && c.state === 'running') ? clamp((AUDIO.sfxAt - c.currentTime) * 1000, 500, 2600) : 500;
  }
  revealTimer = setTimeout(() => { revealTimer = null; showNextLoot(); }, wait);
}
function showNextLoot(){

async function revealAct(a, id){
  const it = state.lootPending.find(x => x.id === id);
  if(!it){ closeModal(); revealOpen = false; return; }
  if(a === 'later'){ revealSkip[id] = 1; closeModal(); revealOpen = false; return; }
  let ok = true;
  if(a === 'keep'){
    if(bagFull()) return;
    state.lootPending = state.lootPending.filter(x => x.id !== id); state.bag.push(it);
    notify('ITEM KEPT', it.name+' went into your bag.', 'ok', 'equip');
  }
  else if(a === 'equip') ok = equipItem(id);
  else if(a === 'sell') ok = await sellItem(id);
  else if(a === 'dismantle') ok = await dismantleItem(id);
  if(!ok){ if(state.lootPending.some(x => x.id === id)) showLoot(it, true); return; }   // cancelled: back to the reveal
  closeModal(); revealOpen = false; afterChange(); queueReveal(700);
}

/* ---------- inventory actions ---------- */
function findItem(id){
  let i = state.lootPending.findIndex(x => x.id === id); if(i >= 0) return { it:state.lootPending[i], where:'pending', idx:i };
  i = state.bag.findIndex(x => x.id === id); if(i >= 0) return { it:state.bag[i], where:'bag', idx:i };
  for(const slot of LOOT_TYPES){ const it = state.equipped[slot]; if(it && it.id === id) return { it, where:'eq', slot }; }
  return null;
}
function removeItem(f){
  if(f.where === 'pending') state.lootPending.splice(f.idx, 1);
  else if(f.where === 'bag') state.bag.splice(f.idx, 1);
  else state.equipped[f.slot] = null;
}
function equipItem(id){
  const f = findItem(id); if(!f || f.where === 'eq') return false;
  const slot = f.it.type, old = state.equipped[slot];
  const free = bagCap() - state.bag.length + (f.where === 'bag' ? 1 : 0);
  if(old && free < 1){ notify('BAG FULL', 'No room to swap. Sell or dismantle something first.', 'pen', 'deny'); return false; }
  removeItem(f);
  state.equipped[slot] = f.it;
  if(old) state.bag.push(old);
  clampVitals();
  notify('EQUIPPED', f.it.name+(old ? ' (swapped with '+old.name+')' : ''), 'ok', 'equip');
  return true;
}
function unequipItem(slot){
  const it = state.equipped[slot]; if(!it) return false;
  if(bagFull()){ notify('BAG FULL', 'No room in your bag.', 'pen', 'deny'); return false; }
  state.equipped[slot] = null; state.bag.push(it); clampVitals();
  notify('UNEQUIPPED', it.name+' moved to your bag.', 'info', 'unequip');
  return true;
}
async function sellItem(id){
  const f = findItem(id); if(!f) return false;
  const v = sellValue(f.it);
  if(!(await ask('SELL ITEM?', 'Sell <b class="rc rar-'+f.it.rarity+'">'+esc(f.it.name)+'</b> for <b class="gold-t">'+fmt(v)+' G</b>? This cannot be undone.', 'SELL', true))) return false;
  const g = findItem(id); if(!g) return false;           // state may have changed while the dialog was open
  removeItem(g); state.gold += v; state.totals.itemsSold++; clampVitals();
  notify('ITEM SOLD', g.it.name+': +'+fmt(v)+' G', 'ok', 'sell');
  return true;
}
async function dismantleItem(id){
  const f = findItem(id); if(!f) return false;
  const m = CONFIG.loot.dismantle[f.it.rarity];
  if(!(await ask('DISMANTLE ITEM?', 'Break <b class="rc rar-'+f.it.rarity+'">'+esc(f.it.name)+'</b> into <b class="gold-t">'+m+' material'+(m>1?'s':'')+'</b>? This cannot be undone.', 'DISMANTLE', true))) return false;
  const g = findItem(id); if(!g) return false;
  removeItem(g); state.materials += m; state.totals.itemsDismantled++; clampVitals();
  notify('ITEM DISMANTLED', g.it.name+': +'+m+' materials', 'ok', 'dismantle');
  return true;
}
async function forgeItem(rarity){
  const cost = CONFIG.loot.forge[rarity];
  if(!cost || state.materials < cost) return notify('FORGE', 'Not enough materials.', 'pen', 'deny');
  if(!(await ask('FORGE ITEM?', 'Spend <b class="gold-t">'+cost+' materials</b> to forge a guaranteed <b>'+CONFIG.loot.rarityNames[rarity]+'</b> item of a random type?', 'FORGE'))) return;
  state.materials -= cost;
  const it = makeItem(rarity); sfx('forge');
  grantLoot(it); afterChange();
}

/* ---------- hidden quests ---------- */
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const hiddenDiff = () => { const r = rankOf(state.level); return r === 'N' ? 'S' : r; };
function makeHidden(){
  const H = CONFIG.hidden, p = pick(H.pool), now = Date.now();
  const n = Math.min(p.max, Math.max(1, Math.round(p.base * (1 + (state.level - 1) * H.levelStep))));   // scales with level; rank sets the reward
  return { id:uid(), text:p.verb+' '+n+' '+p.unit+' within '+p.limit+' minutes', stat:p.stat, diff:hiddenDiff(), minutes:p.minutes, created:now, deadline:now + p.limit*60000, limit:p.limit };
}
function hiddenReward(h){
  const xp = Math.max(1, Math.round(CONFIG.diffBase[h.diff] * CONFIG.hidden.xpMult * xpMult(false)));
  return { xp, gold:Math.round(xp * CONFIG.goldRatio * goldMult()) };
}
function planHidden(today){                           // today's arrival times, in minutes after midnight
  const H = CONFIG.hidden, hi = H.hours[1]*60, lo = Math.max(H.hours[0]*60, today === dkey() ? nowMin() : 0), times = [];
  if(hi - lo >= 10 && Math.random() < H.dayChance){
    let n = 1; while(n < H.maxPerDay && Math.random() < H.secondChance) n++;
    times.push(Math.floor(lo + Math.random() * Math.max(0, (hi - lo) - (n-1)*H.minGapMin)));
    for(let i = 1; i < n; i++){
      const from = times[i-1] + H.minGapMin;
      if(from >= hi - 5) break;
      times.push(Math.floor(from + Math.random() * (hi - from)));
    }
  }
  return times;
}
function ensureHiddenPlan(){
  const t = dkey();
  if(!state.hiddenPlan || state.hiddenPlan.date !== t) state.hiddenPlan = { date:t, times:planHidden(t), next:0 };
  return state.hiddenPlan;
}
function spawnHidden(){
  state.hidden = makeHidden();
  banner('hid', 'A HIDDEN QUEST HAS ARRIVED', state.hidden.text, 4600);
  notify('HIDDEN QUEST', state.hidden.text, 'lv', 'hidden');
}
function expireHidden(){
  const snap = snapLevel();
  state.hidden = null; state.totals.hiddenExpired++;
  if(blockPenalty('Hidden quest')) notify('HIDDEN QUEST EXPIRED', 'Time ran out, but the penalty was blocked.', 'info', 'hiddenFail');
  else {
    const lost = Math.round(CONFIG.hidden.expirePenaltyXp * (1 - penCut()) * eventPenMult());
    loseXp(lost);
    notify('HIDDEN QUEST EXPIRED', 'Time ran out: -'+fmt(lost)+' XP.', 'pen', 'hiddenFail');
  }
  reportDrop(snap);
}
function completeHidden(){
  const h = state.hidden; if(!h) return;
  if(Date.now() >= h.deadline){ expireHidden(); return afterChange(); }
  const r = hiddenReward(h);
  touchStreak();
  state.hidden = null; state.totals.hiddenDone++;
  state.gold += r.gold;
  state.fatigue = Math.min(100, state.fatigue + fatGain(h.minutes * CONFIG.fatiguePerMin));
  notify('HIDDEN QUEST CLEARED', '+'+r.xp+' XP, +'+r.gold+' G and a guaranteed loot roll.', 'lv', 'hiddenOk');
  state.statXp[h.stat] += r.xp;
  const pts = Math.floor(state.statXp[h.stat] / CONFIG.statXpPerPoint);
  if(pts > 0){ state.statXp[h.stat] -= pts*CONFIG.statXpPerPoint; gainStat(h.stat, pts); notify('STAT UP', STAT_NAME[h.stat]+' +'+pts, 'ok', 'statup'); }
  addXp(r.xp);
  shadowsTrain(r.xp, CONFIG.shadowGrowth.hiddenMult);
  dropLoot({ diff:h.diff, guaranteed:true, luck:CONFIG.loot.hiddenLuck });
  afterChange();
}
function hiddenTick(){                                // runs at app-open, at rollover and every second
  if(!state) return false;
  const H = CONFIG.hidden; let changed = false, dirty = false;
  if(state.hidden && Date.now() >= state.hidden.deadline){ expireHidden(); changed = true; }
  const had = state.hiddenPlan && state.hiddenPlan.date === dkey();
  const plan = ensureHiddenPlan(); if(!had) dirty = true;
  if(!state.hidden && plan.next < plan.times.length){
    const m = nowMin();
    if(m >= H.hours[1]*60){ plan.next = plan.times.length; dirty = true; }             // too late today: skip the rest
    else if(m >= plan.times[plan.next]){
      while(plan.next < plan.times.length && plan.times[plan.next] <= m) plan.next++;   // overdue slots collapse into one quest
      spawnHidden(); changed = true;
    }
  }
  if(changed) trialSync();
  if(changed || dirty) save();
  if(changed) render();
  const el = $('#hcd');
  if(el && state.hidden){
    const s = Math.max(0, Math.floor((state.hidden.deadline - Date.now())/1000));
    el.textContent = (s >= 3600 ? Math.floor(s/3600)+':' : '') + pad(Math.floor(s%3600/60)) + ':' + pad(s%60);
    el.classList.toggle('red-t', s < 300);
  }
  return changed;
}
function hiddenCard(){
  const h = state.hidden; if(!h) return '';
  const r = hiddenReward(h), lose = Math.round(CONFIG.hidden.expirePenaltyXp * (1 - penCut()) * eventPenMult());
  return '<div class="win hid"><h2>[ HIDDEN QUEST ]<span class="cd" id="hcd">--:--</span></h2>'
    +'<div class="card"><div class="qhead">'+diffBadge(h.diff)+'<b>'+esc(h.text)+'</b></div>'
    +'<div class="meta">'+STAT_NAME[h.stat]+' &middot; <em>+'+fmt(r.xp)+' XP</em> &middot; <em class="gold-t">+'+fmt(r.gold)+' G</em> &middot; guaranteed loot<br>Let it expire and you lose <span class="rk">'+fmt(lose)+' XP</span>.</div>'
    +'<button class="btn green wide" data-act="hid-done">COMPLETE</button></div></div>';
}

/* shop */
async function buy(id){
  const it = CONFIG.shop.find(x => x.id===id);
  if(!it || state.gold < it.price) return;
  if(id==='reset' && STATS.every(k => state.alloc[k]===0)){ return notify('SHOP','You have no allocated stat points to refund.','info'); }
  if(id==='bag' && state.bagExp >= CONFIG.loot.bagExpandMax){ return notify('SHOP','Your bag cannot be expanded any further.','info'); }
  let newName = null;
  if(id==='rename'){ newName = await askText('RENAME SCROLL','New Player name',state.name,20); if(!newName) return; }
  state.gold -= it.price; sfx('coin');
  if(id==='potion'){ state.fatigue = Math.max(0, state.fatigue-40); notify('ITEM USED','Fatigue -40.','ok'); }
  if(id==='elixir'){ state.hp = maxHp(); state.mp = maxMp(); notify('ITEM USED','HP and MP restored.','ok'); }
  if(id==='booster'){ state.boosterCharges += CONFIG.boosterCharges; notify('ITEM USED','XP Booster active for '+state.boosterCharges+' quests.','ok'); }
  if(id==='rename'){ state.name = newName; notify('ITEM USED','You are now '+newName+'.','ok'); }
  if(id==='rune'){ state.arise++; notify('ITEM USED','+1 ARISE attempt.','ok'); }
  if(id==='crate'){ grantLoot(makeItem(rollRarity(lootLuck('E', CONFIG.loot.crateLuck)))); sfx('forge'); }
  if(id==='bag'){ state.bagExp++; notify('BAG EXPANDED','Bag capacity is now '+bagCap()+'.','ok','equip'); }
  if(id==='reset'){
    let refund = 0;
    STATS.forEach(k => { state.stats[k] -= state.alloc[k]; refund += state.alloc[k]; state.alloc[k] = 0; });
    state.points += refund; pending = {str:0,agi:0,vit:0,int:0,sense:0};
    state.hp = Math.min(state.hp, maxHp()); state.mp = Math.min(state.mp, maxMp());
    notify('STATS RESET','Refunded '+refund+' stat points.','ok');
  }
  afterChange();
}

/* ---------- 1. weekly auto-scaling ---------- */
function scaleTarget(q){
  const S = CONFIG.scaling, step = pickN(S.round, q.unit, 1), minStep = pickN(S.minStep, q.unit, step), cap = pickN(S.cap, q.unit, Infinity);
  if(!(q.target < cap)) return q.target;
  let t = Math.round(q.target * (1 + S.pct) / step) * step;
  t = Math.max(t, q.target + minStep);
  return +Math.min(t, cap).toFixed(2);
}
function dueStats(q, mon){                                 // how many days the quest was due in that week and on how many it was failed or missed
  let due = 0, fails = 0;
  for(let i = 0; i < 7; i++){
    const day = addDays(mon, i); if(q.created > day) continue;
    due++; const e = state.qlog[day] && state.qlog[day][q.id]; if(e === 0) fails++;
  }
  return { due, fails };
}
function runScaling(mon){
  const S = CONFIG.scaling, lastMon = addDays(mon, -7), lastSun = addDays(mon, -1), items = [];
  state.scaleWeek = mon;
  if(!(S.pct > 0)) return;
  state.quests.forEach(q => {
    if(q.repeat !== 'daily' || q.kind === 'rest') return;     // rest quests and non-daily quests never scale
    if(q.created > lastSun) return;                           // made this week: nothing to judge yet
    const base = { id:q.id, name:q.name, unit:q.unit, from:q.target, to:q.target, fails:0, due:0 };
    if(q.locked) return items.push(Object.assign(base, { st:'locked' }));
    const f = dueStats(q, lastMon);
    if(f.fails > f.due * S.failLimit) return items.push(Object.assign(base, { st:'failed', fails:f.fails, due:f.due }));
    const to = scaleTarget(q);
    if(!(to > q.target)) return items.push(Object.assign(base, { st:'cap' }));
    items.push(Object.assign(base, { st:'up', to })); q.target = to;
  });
  state.scaleNote = items.length ? { week:mon, pct:S.pct, items } : null;
}
function lockRevert(id){                                   // the opt-out in the announcement: put the old target back and lock the quest
  const n = state.scaleNote, it = n && n.items.find(x => x.id === id && x.st === 'up'), q = state.quests.find(x => x.id === id);
  if(!it) return;
  if(q){ q.target = it.from; q.locked = true; }
  it.st = 'reverted'; sfx('lock'); save(); render();
}
function scaleHtml(n){
  const mark = { up:['&#9650;', 'green-t'], locked:['&#9632;', 'gold-t'], failed:['&#10006;', 'red-t'], cap:['=', 'r-E'], reverted:['&#8634;', 'gold-t'] };
  const rows = n.items.map(it => {
    const u = ' ' + esc(it.unit), from = '<b>' + fmtT(it.from) + '</b>', m = mark[it.st];
    let body, btn = '';
    if(it.st === 'up'){ body = from + ' &rarr; <b class="green-t">' + fmtT(it.to) + '</b>' + u; btn = '<button class="btn wide" style="margin-top:8px" data-sc="' + esc(it.id) + '">LOCK &amp; KEEP ' + fmtT(it.from) + '</button>'; }
    else if(it.st === 'reverted') body = 'Back to ' + from + u + ' and locked.';
    else if(it.st === 'locked') body = '<b class="gold-t">LOCKED.</b> Stays at ' + from + u + '.';
    else if(it.st === 'failed') body = '<b class="red-t">NOT RAISED.</b> You failed ' + it.fails + ' of ' + it.due + ' days last week, more than half. The System does not raise a quest you are failing. Stays at ' + from + u + '.';
    else body = 'Already at the maximum. Stays at ' + from + u + '.';
    return '<div class="card"><div class="qhead"><span class="badge ' + m[1] + '">' + m[0] + '</span><b>' + esc(it.name) + '</b></div><div class="meta" style="margin:0">' + body + '</div>' + btn + '</div>';

const metricDefs = unit => hasOwn(CONFIG.records.metrics, unit) ? CONFIG.records.metrics[unit] : [];

function logResult(q, res){                                // stores the result, returns which metrics got a first record or broke one
  const out = { first:[], broken:[] }, t = dkey();
  const rec = state.records[q.id] || (state.records[q.id] = { name:q.name, unit:q.unit, m:{} });
  rec.name = q.name; rec.unit = q.unit;
  metricDefs(q.unit).forEach(D => {
    let v = +res[D.k]; if(!(v >= D.min && v <= D.max)) return;
    v = snapStep(v, D); if(!(v >= D.min)) return;
    const m = rec.m[D.k] || (rec.m[D.k] = { best:0, date:null, hist:[] }), had = m.best > 0;
    m.hist.push({ d:t, v }); if(m.hist.length > CONFIG.records.histKeep) m.hist.splice(0, m.hist.length - CONFIG.records.histKeep);
    if(!had){ m.best = v; m.date = t; out.first.push(D); }
    else if(v >= m.best + D.minGain - 1e-9){ m.best = v; m.date = t; out.broken.push(D); }

}

  if(!r.broken.length) return;

  notify('NEW RECORD', q.name + ': ' + txt + '. +' + bonus + ' bonus XP.', 'lv', 'record');

}

function trendSvg(h, best){                                // inline SVG: the last N results, the record as a dashed line and gold dots

}

  const total = w.done + w.failed, rate = total ? w.done / total : 0, tier = reportTier(w, rate), lines = R.verdicts[tier];
